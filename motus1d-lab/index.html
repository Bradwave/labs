<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motus 1D Lab</title>
<meta name="description" content="Motus 1D Lab: one-dimensional motion for the physics classroom. Move a cart, write equations or draw graphs, and read slopes and areas of the s-t, v-t and a-t graphs.">
<meta name="theme-color" content="#4D7BFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* fonts travel with the app: it works offline and nothing is fetched from third parties (licenses in fonts/LICENSES.txt) */
@font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/space-mono-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/space-mono-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-mono-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-mono-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Material Symbols Outlined';font-style:normal;font-weight:400 700;font-display:block;src:url(fonts/material-symbols-subset.woff2) format('woff2')}
/* Layout: stage (toolbar · track · three stacked graphs · time strip) beside a tabbed panel (Motion · Analysis · Settings); the page scrolls on phones.
   Letter tiles, ink borders, hard shadows, grid sheet. Blue world. */
:root{
  --bg:#4D7BFF; --bgline:rgba(8,16,60,.15);
  --surface:#F3F6FF; --ink:#0A1240; --muted:#4B5A8F;
  --accent:#FF4B2B; --onaccent:#FFF6F2; --tile2:#FFD23F;
  --gridline:rgba(10,18,64,.13);
  --cs:#1F47D6; --cv:#0E9A63; --ca:#B42BA0;
  --neg:#E2412A; --over:#F5A400; --under:#13A7C2;
  --err:#D21F1F; --warn:#E07800; --target:rgba(255,190,0,.5); --hatch:rgba(10,18,64,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050A2C; --bgline:rgba(120,150,255,.11);
    --surface:#141F5E; --ink:#E9EEFF; --muted:#A3B3E8;
    --accent:#FF6A4D; --onaccent:#1F0703; --tile2:#F2C230;
    --gridline:rgba(233,238,255,.12);
    --cs:#8FA8FF; --cv:#3DDC97; --ca:#F27ADF;
    --neg:#FF7C60; --over:#FFC24D; --under:#4FD8F0;
    --err:#FF6B6B; --warn:#FFA94D; --target:rgba(242,194,48,.42); --hatch:rgba(233,238,255,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050A2C; --bgline:rgba(120,150,255,.11);
  --surface:#141F5E; --ink:#E9EEFF; --muted:#A3B3E8;
  --accent:#FF6A4D; --onaccent:#1F0703; --tile2:#F2C230;
  --gridline:rgba(233,238,255,.12);
  --cs:#8FA8FF; --cv:#3DDC97; --ca:#F27ADF;
  --neg:#FF7C60; --over:#FFC24D; --under:#4FD8F0;
  --err:#FF6B6B; --warn:#FFA94D; --target:rgba(242,194,48,.42); --hatch:rgba(233,238,255,.32);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--bgline) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--bgline) 1.5px,transparent 1.5px);
  background-size:28px 28px;color:var(--ink);
  font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;overflow:hidden;
}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;width:20px;overflow:hidden;flex:none}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic .fill{fill:currentColor;stroke:none}.ic .soft{fill:currentColor;opacity:.3;stroke:none}.ic .hl{stroke:var(--accent)}
.ic .thin{stroke-width:1.2;opacity:.75}.ic .box{stroke-width:1.6}.ic .hol{fill:var(--surface);stroke-width:1.6}
.on .ic .hol{fill:var(--ink)}

/* header: letter tiles, the "s" slides back and forth along a line */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;max-width:1500px;width:100%;margin:0 auto;padding-block:14px 2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}
.word{display:flex;flex-wrap:wrap;margin:0;font-size:clamp(20px,3vw,34px);font-weight:700;line-height:1}
.word span{width:1.32em;height:1.32em;display:grid;place-items:center;border:2px solid var(--ink);margin:0 -2px -2px 0;background:var(--surface);color:var(--ink)}
.word span.a{background:var(--accent);color:var(--onaccent)}
.word span.b{background:var(--tile2);color:#0A1240}
.word span.k{background:var(--ink);color:var(--surface)}
.word span.sl{border-radius:50%;margin-left:5px;animation:slide 2.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.word i{width:.6em}
.word .lab{align-self:flex-end;font-size:.6em;line-height:1;margin-left:.3em;color:var(--ink);letter-spacing:.01em}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(.42em)}}
.tag-line{margin:8px 0 0;font-size:12.5px;max-width:70ch}
.tools{display:flex;gap:10px;align-items:center}
.icon-btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);width:42px;height:42px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);cursor:pointer;flex:none;padding:0}
.icon-btn:active{transform:translate(3px,3px);box-shadow:none}

/* layout */
.layout{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);gap:22px;max-width:1500px;margin:0 auto;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;flex:none}
.grow{flex:1}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:6px 10px;box-shadow:3px 3px 0 var(--ink);display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:34px}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn:disabled{opacity:.4;pointer-events:none}
.seg{display:inline-flex;border:2px solid var(--ink);background:var(--surface);max-width:100%;flex-wrap:wrap}
.seg button{font-weight:700;font-size:12.5px;padding:6px 10px;background:transparent;color:var(--ink);border:none;cursor:pointer;display:inline-flex;gap:5px;align-items:center;justify-content:center;min-height:32px;touch-action:manipulation}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg.small button{padding:4px 8px;font-size:11.5px;min-height:28px}
.seg .ms{font-size:18px;width:18px}

/* task message from a shared link */
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;flex:none;background:var(--tile2);color:#0A1240}
.task .txt{flex:1;min-width:0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.task .mini{color:#0A1240;border-color:#0A1240;background:transparent}

/* track */
.trackwrap{position:relative;height:104px;flex:none;overflow:hidden;touch-action:none}
#trk{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#trk.grab{cursor:grab}
.fab{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--accent);color:var(--onaccent);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.fab .ms{font-size:30px;width:30px}
.fab.recording{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:3px 3px 0 var(--ink),0 0 0 0 var(--accent)}to{box-shadow:3px 3px 0 var(--ink),0 0 0 9px transparent}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:700;color:var(--accent);pointer-events:none;-webkit-text-stroke:2px var(--ink)}
.toast{position:absolute;top:8px;left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--surface);padding:8px 12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%;text-align:center;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* graphs */
.graphs{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:0;padding:4px 4px 2px}
.gwrap{position:relative;flex:1 1 0;min-height:96px}
.gwrap+.gwrap{border-top:1.5px dashed var(--gridline)}
.gwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:crosshair}
.gmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-size:12px;color:var(--muted);pointer-events:none}

/* time strip */
.quick{display:flex;flex-direction:column;gap:6px;padding:8px 10px;flex:none}
.scrub{display:flex;align-items:center;gap:10px}
.scrub input[type=range]{flex:1;min-width:0}
.vals{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums;align-items:center}
.val{border:1.5px solid var(--ink);padding:2px 7px;white-space:nowrap}
.val b{font-weight:700}
.val i{font-style:normal;display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink);margin-right:6px;vertical-align:-1px}
.qtools{display:flex;gap:6px;margin-left:auto}
.qt{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);width:34px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.qt.on{background:var(--ink);color:var(--surface)}

/* panel */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;align-items:flex-end;flex:none}
.tab{font-weight:700;font-size:13px;padding:9px 14px;border:2px solid var(--ink);border-bottom:none;background:var(--bg);color:var(--ink);cursor:pointer;margin-right:-2px;opacity:.85;display:inline-flex;gap:6px;align-items:center}
.tab .ms{font-size:18px;width:18px}
.tab.on{background:var(--surface);opacity:1;position:relative;z-index:1;margin-bottom:-2px;padding-bottom:11px}
.tabpane{padding:12px 14px;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
h3.grp{font-size:12px;margin:16px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
h3.grp:first-child{margin-top:2px}
:root:not([data-theme="light"]) h3.grp{color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin:6px 0}
.note b{color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{border:2px solid var(--ink);background:var(--surface);color:var(--ink);width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0;flex:none;touch-action:manipulation}
.mini .ms{font-size:18px;width:18px}
.mini.on{background:var(--ink);color:var(--surface)}
.mini:disabled{opacity:.35;pointer-events:none}

/* sections */
.sec{border:2px solid var(--ink);padding:8px 9px 9px;background:var(--surface)}
.sec .sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{min-width:26px;height:26px;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-weight:700;font-size:13px;padding:0 4px}
.eq{display:flex;align-items:center;gap:6px;margin-top:7px}
.eq label{font-size:13px;font-weight:700;min-width:5ch;text-align:right;color:var(--muted);white-space:nowrap}
.eq input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:6px 8px;font-size:14px;border-radius:0}
.eq input:disabled{border-style:dashed;color:var(--muted);background:transparent}
.eq input.bad{border-color:var(--err);background:color-mix(in srgb,var(--err) 10%,var(--surface))}
.eq input.short{flex:0 0 7ch}
.eq .unit{font-size:12px;color:var(--muted)}
.eq .from{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prev{font-size:11.5px;color:var(--muted);margin:7px 0 0;overflow-wrap:anywhere}
.err{font-size:11px;color:var(--err);margin:4px 0 0;font-weight:700}
.err:empty{display:none}
.joint{display:flex;align-items:center;gap:8px;margin:0 0 0 14px;padding:4px 0 4px 12px;border-left:3px solid var(--ink);font-size:11.5px;font-weight:700}
.joint .st{display:inline-flex;gap:6px;align-items:center;padding:3px 7px;border:1.5px solid currentColor}
.joint.smooth{color:var(--cv)}.joint.acorner{color:var(--muted)}.joint.kink{color:var(--warn)}.joint.jump{color:var(--err)}
.joint .mini{width:28px;height:28px;border-width:1.5px}
.joint .sp{flex:1}
.joint small{font-weight:400;color:var(--muted)}
.seclist{display:flex;flex-direction:column;gap:0;margin-top:10px}
.seclist>.sec+.sec{margin-top:10px}

/* params */
.prm{margin:8px 0;padding-bottom:6px;border-bottom:1px dotted var(--gridline)}
.prm .ph{display:flex;align-items:center;gap:6px}
.prm .pn{font-weight:700;font-size:15px;min-width:2.4ch;color:var(--accent)}
.prm .pv{width:78px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:3px 6px;font-size:13px;border-radius:0;font-variant-numeric:tabular-nums}
.prm .rng{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.prm .rng input{width:58px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:2px 4px;font-size:11.5px;border-radius:0}

/* toggles and sliders */
.tg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px dotted var(--gridline);padding:7px 2px;color:var(--ink);font-size:12.5px;cursor:pointer;touch-action:manipulation}
.tg .txt{flex:1;min-width:0}
.tg .txt small{display:block;color:var(--muted);font-size:10.5px;line-height:1.3}
.tg .box{width:36px;height:20px;border:2px solid var(--ink);position:relative;flex:none;background:var(--surface)}
.tg .box::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink);transition:left .15s}
.tg[aria-pressed="true"] .box{background:var(--accent)}
.tg[aria-pressed="true"] .box::after{left:18px;background:var(--onaccent)}
.ctl{margin:10px 0}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.ctl b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;background:var(--accent);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
input[type=range]::-moz-range-track{height:4px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:0;background:var(--accent);border:2px solid var(--ink);cursor:pointer}
.numin{width:80px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:5px 6px;font-size:13px;border-radius:0}

/* interval values */
.stats{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats td{padding:5px 4px;border-bottom:1px dotted var(--gridline);vertical-align:top}
.stats td:first-child{color:var(--muted)}
.stats td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.stats tr.hd td{color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink)}
.stats small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.flag{border:2px solid var(--err);color:var(--err);padding:6px 8px;font-size:11.5px;font-weight:700;margin-top:8px}
.flag.w{border-color:var(--warn);color:var(--warn)}

/* lists: recordings, targets, gallery */
.reclist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.rec{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);padding:5px 6px 5px 10px;font-size:12.5px;cursor:pointer;background:var(--surface);color:var(--ink);text-align:left;width:100%}
.rec.on{background:var(--ink);color:var(--surface)}
.rec .sp{flex:1}
.rec .mini{width:26px;height:26px;border-width:1.5px;color:var(--ink);background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.gcard{border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;box-shadow:3px 3px 0 var(--ink);font-family:inherit}
.gcard:active{transform:translate(3px,3px);box-shadow:none}
.gcard.on{outline:3px solid var(--accent);outline-offset:-1px}
.gcard canvas{width:100%;height:58px;display:block;border:1.5px solid var(--gridline)}
.gcard b{font-size:12px;line-height:1.25}
.gcard small{font-size:10.5px;color:var(--muted);line-height:1.3}
.gcard .score{font-size:11px;font-weight:700;color:var(--accent)}
.bigscore{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);padding:8px 10px;margin-top:10px}
.bigscore b{font-size:28px;line-height:1;color:var(--accent)}

dialog{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--surface);color:var(--ink);max-width:min(720px,94vw);width:100%;max-height:88dvh;padding:18px 20px;font-family:inherit}
dialog::backdrop{background:rgba(6,12,46,.6)}
dialog h2{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
dialog h3{font-size:13px;color:var(--accent);margin:16px 0 4px}
dialog p,dialog li{font-size:12.5px}
dialog ul{padding-left:18px;margin:4px 0}
dialog code{background:color-mix(in srgb,var(--bg) 25%,var(--surface));padding:0 4px;font-size:12px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px;margin:6px 0}
.legend .k{display:grid;place-items:center;width:30px;height:28px;border:1.5px solid var(--ink)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-word{font-size:22px;margin-bottom:12px}
textarea.ta,input.ta{width:100%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:7px 8px;font-size:12.5px;border-radius:0;font-family:inherit}
textarea.ta{min-height:70px;resize:vertical}
kbd{font-family:inherit;font-size:10px;border:1px solid currentColor;padding:0 3px}
.mob{display:none}


/* phone menu, number rows, chips, vertical scene */
#menuBtn{display:none}
.tools{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;display:flex;flex-direction:column;min-width:230px;padding:4px}
.menu button{display:flex;align-items:center;gap:10px;background:none;border:none;border-bottom:1px dotted var(--gridline);color:var(--ink);padding:10px 8px;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
.menu button:last-child{border-bottom:none}
.menu button b{margin-left:auto;font-weight:400;color:var(--muted)}
#speedBtn{display:none;min-width:44px;justify-content:center}
.nrows{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.nrow{display:flex;align-items:center;gap:8px;font-size:13px}
.nrow .nl{min-width:6ch;text-align:right;font-weight:700;color:var(--muted)}
.nrow .unit{font-size:12px;color:var(--muted)}
.chip{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-size:11.5px;font-weight:700;padding:3px 8px;cursor:pointer;font-family:inherit}
.chip:active{background:var(--ink);color:var(--surface)}
.arena{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0}
.arena.vert{flex-direction:row}
.arena.vert .trackwrap{height:auto;width:128px;flex:none}
.arena.vert .graphs{flex:1 1 auto;min-width:0}
.arena.vert .fab{top:auto;bottom:12px;right:6px;transform:none}
/* hand: the vertical track and the record button go on the side of the hand that drags */
.arena.vert .trackwrap{order:2}
.arena.vert.lefty .trackwrap{order:0}
.arena.vert .graphs{order:1}
.arena.vert.lefty .fab{right:auto;left:6px}
.arena.lefty:not(.vert) .fab{right:auto;left:10px}
.graphs{position:relative}
.gmsg.draw{top:auto;bottom:8px;height:auto;padding:6px 12px}
.gdone{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;box-shadow:3px 3px 0 var(--ink)}
.btn.armed{background:var(--accent);color:var(--onaccent)}
body.picking .gwrap canvas,body.picking .trackwrap{cursor:pointer}
.gwrap canvas,.trackwrap{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pick{position:fixed;z-index:40;display:flex;gap:4px;align-items:center;padding:4px;box-shadow:3px 3px 0 var(--ink)}
.pick .ltr{width:26px;height:26px;display:grid;place-items:center;font-weight:700;border:2px solid var(--ink);background:var(--tile2);color:#0A1240;margin-right:2px}
.pick .ltr.act{background:var(--accent);color:var(--onaccent)}
.mini.ok{background:var(--accent);color:var(--onaccent)}
.undobar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;white-space:nowrap;gap:10px;align-items:center;background:var(--ink);color:var(--surface);padding:6px 6px 6px 12px;font-size:12.5px;font-weight:700}
.gdone:active{transform:translate(calc(-50% + 3px),3px);box-shadow:none}
#ffBox{margin-bottom:10px}
.joint.coll{color:var(--accent)}


/* phase 3: object B, authoring chips, QR, export */
.seclist.objB .badge{background:var(--tile2);color:#0A1240}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip.on{background:var(--ink);color:var(--surface)}
details.feats{margin-top:10px;border:2px solid var(--ink);padding:6px 10px}
details.feats summary{cursor:pointer;font-weight:700;font-size:12.5px}
.qrrow{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
#qrCv{width:160px;height:160px;image-rendering:pixelated;border:2px solid var(--ink);background:#fff}
.qrdlg{max-width:96vw;width:auto;text-align:center}
#qrCvBig{width:min(80vw,72dvh);height:min(80vw,72dvh);image-rendering:pixelated;border:2px solid var(--ink);display:block;margin:0 auto}
#qrTask{font-size:16px;font-weight:700;max-width:60ch;margin:12px auto 0;white-space:pre-wrap}
textarea.mono{min-height:140px;font-size:11px}
.pngout{display:block;max-width:100%;border:2px solid var(--ink);margin:6px 0}
.note.meet{white-space:pre-line;color:var(--ink);font-weight:700}


/* list of motions */
.motbox{margin-bottom:12px}
.motlist{display:flex;flex-direction:column;border:2px solid var(--ink)}
.mot{display:flex;align-items:center;gap:4px;padding-right:6px;background:var(--surface)}
.mot+.mot{border-top:1.5px dotted var(--gridline)}
.mot.on{background:var(--ink)}
.mot.on .motmain{color:var(--surface)}
.motmain{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink);padding:6px 8px;font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.motmain .mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mletter{width:24px;height:24px;display:grid;place-items:center;font-weight:700;border:2px solid currentColor;background:var(--tile2);color:#0A1240;flex:none}
.mot.on .mletter{background:var(--accent);color:var(--onaccent);border-color:var(--onaccent)}
.mot .mini{width:28px;height:28px;border-width:1.5px}
.motacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn.small{padding:4px 8px;font-size:11.5px;min-height:30px;box-shadow:2px 2px 0 var(--ink)}
.btn.small .ms{font-size:18px;width:18px}
.warnnote{color:var(--warn);font-weight:700}
/* steady numbers */
.val b{display:inline-block;min-width:5.5ch;text-align:right}
/* groups that open with a wrapper still get their space */
.tabpane > div:not(:first-child) > h3.grp:first-child{margin-top:16px}
#mWipe{flex-wrap:wrap}
#mWipeVal{white-space:normal;font-size:11px;color:var(--err);flex-basis:100%;margin-left:34px!important;margin-top:2px}


.mini.ghost{border-color:transparent;background:transparent;pointer-events:none}
.mini.del.arm{background:var(--err);color:#fff;border-color:var(--ink)}
.mot.on .mini.del{background:var(--surface)}
.mdate{font-size:10.5px;color:var(--muted);white-space:nowrap}
.mot.on .mdate{color:var(--surface);opacity:.8}
#sceneList .mot{padding-right:6px}


/* values under the graphs: one row per object, one column per quantity; headers and cells are toggles */
.scrub .tl{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:9ch;text-align:right}
.vrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.vtwrap{flex:1 1 auto;min-width:0;overflow-x:auto}
.vt{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.vt th,.vt td{border:1.5px solid var(--ink);padding:0}
.vt button{display:flex;align-items:center;gap:6px;width:100%;background:var(--surface);color:var(--ink);border:none;padding:3px 8px;font:inherit;cursor:pointer;white-space:nowrap;justify-content:flex-end}
.vt thead button{font-weight:700;justify-content:center}
.vt thead button i{width:9px;height:9px;border:1.5px solid var(--ink);display:inline-block}
.vt tbody th button{justify-content:center;padding:3px 6px}
.vt .ltr{width:20px;height:20px;display:grid;place-items:center;font-weight:700;border:2px solid var(--ink);background:var(--tile2);color:#0A1240}
.vt .ltr.act{background:var(--accent);color:var(--onaccent)}
.vt .off{opacity:.38}
.vt .off .v{text-decoration:line-through}
.vt td button .v{min-width:6.5ch;text-align:right;font-weight:700}
.vt td button .u{color:var(--muted);font-size:11px}
.vt thead th:first-child{border-left:none;border-top:none;background:transparent}

/* phones in portrait: the page scrolls, graphs get a fixed height */
@media (max-width:920px) and (orientation:portrait){
  body{overflow:auto;display:block}
  .tag-line{display:none}
  .top{padding-block:8px 0}
  .layout{display:flex;flex-direction:column;gap:12px;padding-block:8px 16px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .stage{gap:9px}
  .graphs{flex:none}
  .gwrap{flex:none;height:150px}
  .arena{flex:none}
  .arena.vert .trackwrap{width:96px}
  .arena.vert{min-height:476px} /* the track keeps its length when graphs are hidden; the graphs left are centred */
  .arena.vert .graphs{justify-content:center}
  #themeBtn,#langBtn,#helpBtn,#shareBtn,#speedSeg,#scenesBtn{display:none}
  #menuBtn{display:grid}
  #speedBtn{display:inline-flex}
  .word{font-size:20px}
  .icon-btn{width:38px;height:38px}
  .panel{flex:none;min-height:60dvh}
  .tabpane{overflow:visible}
  .card{box-shadow:4px 4px 0 var(--ink)}
  .toolbar{padding:6px 8px;gap:6px}
  .btn .lbl{display:none}
  .quick{padding:6px 8px}
}
@media (max-height:620px) and (orientation:landscape){
  .tag-line{display:none}
  .top{padding-block:6px 0}
  .word{font-size:20px}
  .layout{padding-block:8px;gap:14px;grid-template-columns:minmax(0,1fr) minmax(290px,370px)}
  .trackwrap{height:84px}
  .gwrap{min-height:70px}
  .btn .lbl{display:none}
}
@media (max-width:480px){
  .motmain>.ms{display:none} /* the name already says the type */
  .seg.src .t{display:none}
  #stepBtn{display:none}
  .tab{padding:8px 10px;font-size:12px}
  .tab .t{display:none}
  .tab.on .t{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--surface);border-left:2px solid var(--ink);border-top:2px solid var(--ink)}
::-webkit-scrollbar-thumb{background:var(--accent);border:2px solid var(--ink)}
::-webkit-scrollbar-corner{background:var(--surface)}

/* activities: predict · discuss · compare. A full-page layer over the explorer; graphs big enough for a group around one device */
.pdc{position:fixed;inset:0;z-index:60;overflow:auto;background-color:var(--bg);background-image:linear-gradient(var(--bgline) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--bgline) 1.5px,transparent 1.5px);background-size:28px 28px;padding:12px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
body.pdc-on{overflow:hidden}
.pdc-head{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 8px;flex:none}
.pdc-htitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pdc-htitle b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdc-htitle small{font-size:11px;color:var(--muted)}
.pdc-head > .pdc-htitle:first-child{flex-direction:row;align-items:center;gap:8px}
.pdc-dots{display:flex;gap:4px;flex-wrap:wrap;max-width:40%}
.pdc-dots i{width:12px;height:12px;border:2px solid var(--ink);background:var(--surface)}
.pdc-dots i.done{background:var(--muted)}
.pdc-dots i.on{background:var(--accent)}
.pdc-intro{margin:0;background:var(--surface);border:2px solid var(--ink);padding:8px 10px;font-size:12.5px;max-width:860px}
.pdc-list{display:flex;flex-direction:column;gap:12px;max-width:860px}
.pdc-sec{font-size:13px;margin:6px 0 0;color:var(--onaccent);background:var(--ink);align-self:flex-start;padding:2px 8px}
.pdc-acard{padding:12px 14px}
.pdc-acard h3{margin:0 0 4px;font-size:16px}
.pdc-meta{font-size:11.5px;font-weight:700;margin:6px 0 10px}
.pdc-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pdc-imp{background:var(--surface);border:2px dashed var(--ink);padding:8px 10px}
.pdc-body{flex:1 0 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:12px} /* grows past the screen (and the page scrolls) rather than letting graphs overlap the card */
.pdc-stage{display:flex;flex-direction:column;min-height:0;padding:6px;gap:6px}
.pdc-given{padding:4px 6px;font-size:14px;flex:none}
.pdc-given p{margin:2px 0}
.pdc-eq{font-weight:700;font-size:16px;white-space:pre-line}
.pdc-track{height:96px;flex:none;border-bottom:1.5px dashed var(--gridline);touch-action:none}
.pdc-track canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.pdc-graphs{flex:1;min-height:0;display:flex;flex-direction:column}
.pdc-g{position:relative;flex:1 1 0;min-height:150px}
.pdc-g+.pdc-g{border-top:1.5px dashed var(--gridline)}
.pdc-g canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pdc-g.hidden-g::after{content:attr(data-hid);position:absolute;inset:26px 18px 24px 48px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--gridline) 8px 10px);opacity:.92;font-weight:700;color:var(--muted);border:2px dashed var(--muted);pointer-events:none}
.pdc-card{display:flex;flex-direction:column;min-height:0;padding:0}
.pdc-kind{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);padding:8px 12px;font-weight:700;font-size:15px}
.pdc-cbody{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pdc-prompt{font-size:15px;font-weight:700;margin:0}
.pdc-sub{font-weight:700;margin:4px 0 0;font-size:12.5px}
.pdc-q p{margin:0 0 5px;font-size:13px;font-weight:700}
.pdc-opts{display:flex;flex-wrap:wrap;gap:6px}
.pdc-opts.col{flex-direction:column}
.pdc-opts button{border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;padding:6px 10px;cursor:pointer;text-align:left;min-height:34px}
.pdc-opts button.on{background:var(--ink);color:var(--surface)}
.pdc-opts button:disabled{opacity:.55;cursor:default}
.pdc-num{max-width:120px}
.pdc-open{min-height:54px}
.pdc-timer{font-size:40px;font-weight:700;text-align:center;border:2px solid var(--ink);padding:4px}
.pdc-timer.over{background:var(--accent);color:var(--onaccent)}
.pdc-recbtn{align-self:flex-start;font-size:15px;padding:10px 16px}
.pdc-recbtn.recording{animation:pulse 1s ease-in-out infinite alternate}
.pdc-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;font-weight:700}
.pdc-legend span{display:flex;align-items:center;gap:5px}
.pdc-legend i{width:18px;height:0;border-top:3px solid var(--ink)}
.pdc-legend i.k{height:4px;border:none;background:linear-gradient(90deg,var(--cs) 0 33%,var(--cv) 33% 66%,var(--ca) 66%)}
.pdc-legend i.m{border-color:var(--accent)}
.pdc-legend i.d{border-color:var(--ink)}
.pdc-legend i.o{border-color:var(--accent);opacity:.35}
.pdc-obs{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.pdc-ans{display:flex;flex-direction:column;gap:6px}
.pdc-arow{border:1.5px solid var(--ink);padding:6px 8px;font-size:12.5px}
.pdc-arow p{margin:2px 0}
.pdc-arow .q{font-weight:700}
.pdc-arow .free{font-style:italic;white-space:pre-wrap}
.pdc-arow b{color:var(--muted);font-weight:700}
.pdc-arow.diff{border-width:2.5px}
.pdc-ref{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.pdc-nav{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-top:2px solid var(--ink)}
.pdc-nav .btn{font-size:14px}
.pdc-done{padding:16px;max-width:620px}
.pdc.clean .pdc-card,.pdc.clean .pdc-given,.pdc.clean .pdc-track{display:none}
.pdc.clean .pdc-body{grid-template-columns:1fr}
.pdc .ic-wrap{display:grid;place-items:center}
.pdc:not(.clean) .pdc-cleanx{display:none}
.pdc-legend i.w{border-color:var(--muted)}
.pdc-legend i.b{border-top-style:dashed;border-color:var(--ink)}
.pdc-slot button{min-width:120px}
.pdc-eqin{flex:1;min-width:140px;font-size:15px;font-weight:700}
.pdc-code{max-width:110px;font-size:22px;font-weight:700;letter-spacing:.2em;text-align:center}
.pdc-code.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pdc-pass{font-size:17px;font-weight:700;margin:0;padding:10px;border:2px dashed var(--ink)}
.pdc-secret{font-size:20px;font-weight:700;margin:0;padding:8px;background:var(--ink);color:var(--surface);text-align:center}
.pdc-teach{margin-top:10px;padding-top:8px;border-top:1.5px dotted var(--gridline);font-size:12px}
.pdc-check{display:flex;align-items:center;gap:6px;cursor:pointer}
.pdc-ov{position:fixed;inset:0;z-index:80;background:rgba(5,10,44,.55);display:grid;place-items:center;padding:16px}
.pdc-sheet{max-width:min(980px,96vw);max-height:92dvh;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pdc-sheet h3{margin:0}
.pdc-ovbar{position:sticky;top:-12px;background:var(--surface);padding:4px 0;z-index:1}
.pdc-ovbar .grow{flex:1}
.pdc-boardimg{width:100%;height:auto;border:1.5px solid var(--gridline)}
.pdc-boardsheet:fullscreen{max-width:none;max-height:none;width:100vw;height:100vh;background:var(--surface)}
.pdc-codes{display:flex;flex-direction:column;gap:4px;font-size:13px}
.pdc-codes div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--gridline);padding:3px 0}
.pdc-codes b{font-size:18px;letter-spacing:.15em}

@media (max-width:900px),(orientation:portrait){
  .pdc{overflow:auto}
  .pdc-body{grid-template-columns:1fr;flex:none}
  .pdc-stage{min-height:auto}
  .pdc-g{flex:none;height:210px}
  .pdc-card{min-height:auto}
  .pdc-cbody{overflow:visible}
  .pdc-dots{display:none}
}
@media (max-width:900px) and (orientation:portrait){ .pdc.clean .pdc-g{height:260px} }

<body>
<header class="top">
  <div>
    <h1 class="word" aria-label="Motus 1D Lab">
      <span class="k">m</span><span>o</span><span class="a">t</span><span>u</span><span class="b sl">s</span><i></i><span class="a">1</span><span class="k">D</span><b class="lab">lab</b>
    </h1>
    <p class="tag-line" data-i18n="tag"></p>
  </div>
  <div class="tools">
    <button class="icon-btn act-btn" id="actBtn" data-i18n-title="pdc_open"><span class="ms">school</span></button>
    <button class="icon-btn" id="scenesBtn" data-i18n-title="scenes"><span class="ms">folder_open</span></button>
    <button class="icon-btn" id="themeBtn" data-i18n-title="theme"><span class="ms" id="themeIcon">contrast</span></button>
    <button class="icon-btn" id="langBtn" data-i18n-title="lang" style="font-weight:700;font-size:13px">IT</button>
    <button class="icon-btn" id="helpBtn" data-i18n-title="help"><span class="ms">help</span></button>
    <button class="icon-btn" id="menuBtn" data-i18n-title="menu" aria-expanded="false" aria-controls="menu"><span class="ms">settings</span></button>
    <div class="menu card" id="menu" hidden>
      <button type="button" id="mAct"><span class="ms">school</span><span data-i18n="pdc_title"></span></button>
      <button type="button" id="mScenes"><span class="ms">folder_open</span><span data-i18n="scenes"></span></button>
      <button type="button" id="mTheme"><span class="ms" id="mThemeIcon">contrast</span><span data-i18n="theme_s"></span><b id="mThemeVal"></b></button>
      <button type="button" id="mLang"><span class="ms">translate</span><span data-i18n="lang"></span><b id="mLangVal"></b></button>
      <button type="button" id="mShare"><span class="ms">share</span><span data-i18n="share_make"></span></button>
      <button type="button" id="mImport"><span class="ms">input</span><span data-i18n="import"></span></button>
      <button type="button" id="mExport" data-f="export"><span class="ms">download</span><span data-i18n="export_b"></span></button>
      <button type="button" id="mWipe"><span class="ms">restart_alt</span><span data-i18n="reset_all_b"></span><b id="mWipeVal" hidden></b></button>
      <button type="button" id="mHelp"><span class="ms">help</span><span data-i18n="help"></span></button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="toolbar card">
      <button class="btn primary" id="playBtn"><span class="ms" id="playIcon">play_arrow</span><span class="lbl" id="playLbl"></span></button>
      <button class="btn" id="stepBtn" data-i18n-title="step_t"><span class="ms">skip_next</span></button>
      <button class="btn" id="resetBtn" data-i18n-title="reset_t"><span class="ms">replay</span></button>
      <button class="btn" id="pickBtn" data-i18n-title="pick_t" aria-pressed="false"><span class="ms">arrow_selector_tool</span></button>
      <div class="seg small" id="speedSeg"></div>
      <button class="btn" id="speedBtn" data-i18n-title="speed">1×</button>
      <span class="grow"></span>
      <div class="seg src" id="srcSeg"></div>
      <button class="btn" id="shareBtn" data-i18n-title="share"><span class="ms">share</span></button>
    </div>

    <div class="task card" id="task" hidden><span class="ms">assignment</span><div class="txt" id="taskTxt"></div><button class="mini" id="taskClose" data-i18n-title="close"><span class="ms">close</span></button></div>

    <div class="arena" id="arena">
    <div class="trackwrap card" id="trackWrap">
      <canvas id="trk"></canvas>
      <button class="fab" id="recBtn" hidden><span class="ms" id="recIcon">fiber_manual_record</span></button>
      <div class="count" id="count" hidden></div>
      <div class="toast" id="toast" role="status"></div>
    </div>

    <div class="graphs card" id="graphs">
      <div class="gwrap" id="wS"><canvas id="gS"></canvas><div class="gmsg" id="gmsg" hidden></div></div>
      <div class="gwrap" id="wV"><canvas id="gV"></canvas></div>
      <div class="gwrap" id="wA"><canvas id="gA"></canvas></div>
      <div class="gmsg draw" id="drawMsg" hidden></div>
      <button class="btn small primary gdone" id="editDone" type="button" hidden><span class="ms">check</span><span data-i18n="edit_done"></span></button>
    </div>
    </div>

    <div class="quick card">
      <div class="scrub">
        <input type="range" id="tRange" min="0" max="1" step="0.0005" value="0" data-i18n-aria="time">
        <span class="tl" id="tLbl"></span>
      </div>
      <div class="vrow"><div class="vtwrap"><table class="vt" id="vt"></table></div><span class="qtools" id="qtools"></span></div>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="motion" role="tab"><span class="ms">function</span><span class="t" data-i18n="t_motion"></span></button>
      <button class="tab" data-tab="analysis" role="tab"><span class="ms">area_chart</span><span class="t" data-i18n="t_analysis"></span></button>
      <button class="tab" data-tab="settings" role="tab"><span class="ms">tune</span><span class="t" data-i18n="t_settings"></span></button>
    </div>

    <div class="tabpane card" id="pane-motion">
      <div class="row" style="margin-bottom:10px" data-f="vert"><div class="seg small" id="orientSeg"></div></div>
      <div id="motBox" class="motbox"></div>
      <div id="srcEq">
        <div id="ffBox" hidden></div>
        <div id="eqSecs">
        <div class="row">
          <button class="btn" id="galBtn"><span class="ms">grid_view</span><span data-i18n="gallery"></span></button>
          <span class="grow"></span>
          <div class="seg small" id="tauSeg" data-f="tau"></div>
        </div>
        <div class="seclist" id="secList"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="addSec" data-f="multi"><span class="ms">add</span><span data-i18n="add_sec"></span></button>
        </div>
        <div class="ctl" data-f="joints" id="blendCtl"><label for="blendR"><span data-i18n="blend_w"></span><b id="blendL"></b></label><input type="range" id="blendR" min="0.05" max="2" step="0.05"></div>
        </div>
        <div id="paramBox">
          <h3 class="grp" data-i18n="params"></h3>
          <div id="params"></div>
        </div>
      </div>

      <div id="srcDraw" hidden>
        <div id="recTools" hidden>
          <p class="note" data-i18n="rt_note"></p>
          <div class="seg" id="rtTool"></div>
          <div id="rtRad"></div>
        </div>
        <div id="drawTools">
        <div class="row">
          <div class="seg small" id="drQ"></div>
          <span class="grow"></span>
          <button class="btn" id="drGal"><span class="ms">grid_view</span><span data-i18n="plots"></span></button>
        </div>
        <div class="row" style="margin-top:10px"><div class="seg" id="drTool"></div></div>
        <div id="drSnap"></div>
        <p class="note" id="drMoveNote" data-i18n="move_note" hidden></p>
        <div id="drRad" hidden></div>
        <div id="drIC" class="nrows"></div>
        <p class="note" id="drEmpty" data-i18n="draw_note"></p>
        <div id="drJoints" class="seclist"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="drUndo"><span class="ms">undo</span><span data-i18n="undo"></span></button>
          <button class="btn" id="drClear"><span class="ms">delete_sweep</span><span data-i18n="clear"></span></button>
        </div>
      </div>

      <div id="srcDrag" hidden>
        <p class="note" data-i18n="drag_note"></p>
        <div id="dragFF" hidden></div>
        <p class="note" id="throwNote" data-i18n="throw_note" hidden></p>
        <div class="ctl"><label for="smR"><span data-i18n="smooth"></span><b id="smL"></b></label><input type="range" id="smR" min="1" max="30" step="1"></div>
        <div class="row"><button class="btn" id="clearRecs"><span class="ms">delete_sweep</span><span data-i18n="clear_recs"></span></button></div>
      </div>

      <div id="srcChal" hidden>
        <p class="note" data-i18n="chal_note"></p>
        <div class="bigscore" id="scoreBox" hidden><b id="scoreVal"></b><span id="scoreTxt" class="note" style="margin:0"></span><span class="grow"></span><button class="btn small" id="keepAttempt"><span class="ms">bookmark_add</span><span data-i18n="keep"></span></button></div>
        <div class="cards" id="targets"></div>
        <div class="ctl"><label for="smR2"><span data-i18n="smooth"></span><b id="smL2"></b></label><input type="range" id="smR2" min="1" max="30" step="1"></div>
      </div>
    </div>

    <div class="tabpane card" id="pane-analysis" hidden>
      <div data-f="pred">
        <h3 class="grp" data-i18n="g_pred"></h3>
        <div id="anPred"></div>
        <div id="predCtl" hidden>
          <div class="row" style="margin-top:8px"><div class="seg small" id="predQ"></div><span class="grow"></span>
            <button class="btn primary" id="predReveal"><span class="ms">visibility</span><span data-i18n="reveal"></span></button>
            <button class="btn" id="predRetry"><span class="ms">refresh</span><span data-i18n="retry"></span></button></div>
          <p class="note" id="predNote"></p>
        </div>
      </div>
      <div id="meetBox" hidden>
        <h3 class="grp" data-i18n="g_two"></h3>
        <p class="note meet" id="meetList"></p>
      </div>
      <h3 class="grp" data-i18n="g_slope"></h3>
      <div id="anSlope"></div>
      <h3 class="grp" data-f="areaV" data-i18n="g_area"></h3>
      <div id="anArea"></div>
      <div id="anMethod" data-f="riemann">
        <div class="ctl"><label><span data-i18n="method"></span><b id="methodL"></b></label><div class="seg" id="methodSeg" style="margin-top:6px"></div></div>
        <div class="ctl" id="nCtl"><label for="nR"><span data-i18n="n_rect"></span><b id="nL"></b></label><input type="range" id="nR" min="1" max="60" step="1"></div>
      </div>
      <h3 class="grp" data-f="avg" data-i18n="g_avg"></h3>
      <div id="anAvg"></div>
      <h3 class="grp" id="ivHead" data-i18n="g_interval"></h3>
      <div class="row" id="ivRow">
        <label class="row" style="gap:6px;font-size:12.5px">t₁ <input class="numin" id="t1In" inputmode="decimal"></label>
        <label class="row" style="gap:6px;font-size:12.5px">t₂ <input class="numin" id="t2In" inputmode="decimal"></label>
        <span class="note" style="margin:0" data-i18n="iv_note"></span>
      </div>
      <table class="stats" id="stats"></table>
      <div id="flags"></div>
    </div>

    <div class="tabpane card" id="pane-settings" hidden>
      <h3 class="grp" data-i18n="scenes"></h3>
      <div class="row"><span class="note" style="margin:0;flex:1"><b id="sceneCur"></b></span><button class="btn small" id="scenesBtn2"><span class="ms">folder_open</span><span data-i18n="scenes_manage"></span></button></div>
      <h3 class="grp"><span data-i18n="level"></span><span class="ms" id="lockIcon" hidden>lock</span></h3>
      <div class="seg" id="levelSeg"></div>
      <p class="note" id="levelNote"></p>
      <div data-f="frame">
        <h3 class="grp" data-i18n="g_frame"></h3>
        <div id="frameBox" class="nrows"></div>
      </div>
      <h3 class="grp" data-i18n="qname"></h3>
      <div class="seg" id="qSeg"></div>
      <h3 class="grp" data-i18n="hand"></h3>
      <div class="seg" id="handSeg"></div>
      <h3 class="grp" data-i18n="decimals"></h3>
      <div class="seg" id="decSeg"></div>
      <h3 class="grp" data-i18n="show"></h3>
      <div id="showList"></div>
      <h3 class="grp" data-i18n="share"></h3>
      <div class="row">
        <button class="btn" id="shareBtn2"><span class="ms">share</span><span data-i18n="share_make"></span></button>
        <button class="btn" id="importBtn"><span class="ms">input</span><span data-i18n="import"></span></button>
      </div>
      <div data-f="export">
        <h3 class="grp" data-i18n="export"></h3>
        <button class="btn" id="expBtn"><span class="ms">download</span><span data-i18n="export_b"></span></button>
      </div>
      <h3 class="grp" data-i18n="reset_all"></h3>
      <button class="btn" id="wipeBtn"><span class="ms">restart_alt</span><span data-i18n="reset_all_b"></span></button>
      <p class="note" id="wipeNote" hidden></p>
    </div>
  </aside>
</main>

<div class="pick card" id="pick" hidden></div>
<div class="undobar" id="undoBar" hidden><span id="undoTxt"></span><button class="btn small" id="undoBtn" type="button"><span class="ms">undo</span><span data-i18n="undo"></span></button></div>
<dialog id="galDlg">
  <div class="dlg-head"><h2 id="galTitle"></h2><button class="mini" data-close data-i18n-title="close"><span class="ms">close</span></button></div>
  <p class="note" id="galNote"></p>
  <div class="cards" id="galCards"></div>
</dialog>

<dialog id="sceneDlg">
  <div class="dlg-head"><h2 data-i18n="scenes"></h2><button class="mini" data-close data-i18n-title="close"><span class="ms">close</span></button></div>
  <p class="note" data-i18n="scenes_note"></p>
  <label class="note" for="sceneName" data-i18n="scene_name"></label>
  <input class="ta" id="sceneName" maxlength="60" autocomplete="off">
  <div class="row" style="margin:10px 0"><button class="btn primary" id="sceneNew"><span class="ms">add</span><span data-i18n="scene_new_b"></span></button><button class="btn" id="sceneDup"><span class="ms">content_copy</span><span data-i18n="scene_dup"></span></button></div>
  <div class="motlist" id="sceneList"></div>
  <p class="note warnnote" id="sceneMax" hidden></p>
</dialog>

<dialog id="shareDlg">
  <div class="dlg-head"><h2 data-i18n="share"></h2><button class="mini" data-close data-i18n-title="close"><span class="ms">close</span></button></div>
  <div id="shareMake">
    <p class="note" data-i18n="share_note"></p>
    <label class="note" for="taskIn" data-i18n="task_msg"></label>
    <textarea class="ta" id="taskIn" maxlength="600"></textarea>
    <div id="lockTg"></div>
    <details class="feats"><summary data-i18n="features"></summary><p class="note" data-i18n="features_s"></p><div id="featBox"></div></details>
    <label class="note" for="baseIn" data-i18n="base_url"></label>
    <input class="ta" id="baseIn" spellcheck="false" autocomplete="off">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="mkLink"><span class="ms">link</span><span data-i18n="share_make"></span></button></div>
    <div id="shareOut" hidden>
      <label class="note" for="linkOut" data-i18n="link"></label>
      <input class="ta" id="linkOut" readonly>
      <div class="row" style="margin-top:8px"><button class="btn" id="copyLink"><span class="ms">content_copy</span><span data-i18n="copy"></span></button><span class="note" id="linkLen"></span></div>
      <div class="qrrow" id="qrWrap"><canvas id="qrCv" width="220" height="220"></canvas><div><p class="note" id="qrNote"></p><button class="btn" id="qrBig"><span class="ms">fullscreen</span><span data-i18n="qr_big"></span></button></div></div>
      
    </div>
  </div>
  <div id="shareImport" hidden>
    <p class="note" data-i18n="import_note"></p>
    <textarea class="ta" id="importIn" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="doImport"><span class="ms">input</span><span data-i18n="import"></span></button><span class="err" id="importErr"></span></div>
  </div>
</dialog>

<dialog id="qrDlg" class="qrdlg">
  <div class="dlg-head"><div class="word dlg-word" aria-hidden="true"><span class="k">m</span><span>o</span><span class="a">t</span><span>u</span><span class="b">s</span><i></i><span class="a">1</span><span class="k">D</span><b class="lab">lab</b></div><button class="mini" data-close data-i18n-title="close"><span class="ms">close</span></button></div>
  <canvas id="qrCvBig"></canvas>
  <p id="qrTask"></p>
</dialog>

<dialog id="expDlg">
  <div class="dlg-head"><h2 data-i18n="export"></h2><button class="mini" data-close data-i18n-title="close"><span class="ms">close</span></button></div>
  <h3 data-i18n="exp_csv"></h3>
  <textarea class="ta mono" id="csvOut2" readonly spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" id="copyCsv"><span class="ms">content_copy</span><span data-i18n="copy"></span></button><button class="btn dl" id="dlCsv"><span class="ms">download</span><span data-i18n="download"></span></button></div>
  <h3 data-i18n="exp_png"></h3>
  <img id="pngOut" alt="" class="pngout">
  <p class="note" data-i18n="exp_png_note"></p>
  <div class="row"><button class="btn" id="copyPng"><span class="ms">content_copy</span><span data-i18n="copy_img"></span></button><button class="btn dl" id="dlPng"><span class="ms">download</span><span data-i18n="download"></span></button></div>
</dialog>

<dialog id="helpDlg">
  <div class="dlg-head"><div class="word dlg-word" aria-hidden="true"><span class="k">m</span><span>o</span><span class="a">t</span><span>u</span><span class="b">s</span><i></i><span class="a">1</span><span class="k">D</span><b class="lab">lab</b></div><button class="mini" data-close data-i18n-title="close"><span class="ms">close</span></button></div>
  <div id="helpBody"></div>
</dialog>

<script type="module" src="js/main.js"></script>
