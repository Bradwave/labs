<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo Gallery</title>
<meta name="description" content="The animated logo of every lab: moving, as a still frame, and at favicon size.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<style>
:root{--bg:#c9d3dd;--bgline:rgba(20,32,43,.12);--surface:#f7f9fb;--ink:#14202b;--muted:#4f5f6e;--accent:#e8553d;--onaccent:#14202b;--tile2:#ffd23f;--gridline:rgba(20,32,43,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a22;--bgline:rgba(201,211,221,.07);--surface:#1b2731;--ink:#e8eef3;--muted:#9fb0bf;--accent:#ff7a5c;--onaccent:#111a22;--tile2:#e9b92a;--gridline:rgba(232,238,243,.14)}}
:root[data-theme="dark"]{--bg:#111a22;--bgline:rgba(201,211,221,.07);--surface:#1b2731;--ink:#e8eef3;--muted:#9fb0bf;--accent:#ff7a5c;--onaccent:#111a22;--tile2:#e9b92a;--gridline:rgba(232,238,243,.14)}
main{width:100%;max-width:1400px;margin:0 auto;padding:12px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.item{padding:12px;display:flex;flex-direction:column;gap:8px}
.item h2{font-size:14px;margin:0}
.row2{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.row2 figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10.5px;color:var(--muted)}
.big svg{width:160px;height:160px;display:block}
.mid svg{width:64px;height:64px;display:block}
.fav img{width:32px;height:32px;display:block;image-rendering:auto}
.fav16 img{width:16px;height:16px;display:block}
.still style{display:none}
p.note{max-width:80ch}
</style>
</head>
<body class="scrolls">
<header class="top">
  <h1 class="word" aria-label="Logo Gallery"><span class="a">l</span><span>o</span><span class="b">g</span><span>o</span><span class="k">s</span><b class="lab">labs</b></h1>
  <div class="top-actions"><button class="icon-btn" id="infoBtn" type="button"></button><button class="icon-btn" id="settingsBtn" type="button"></button></div>
</header>
<main>
  <p class="note">Each lab's <code>logo.svg</code>: animated (160 px), the still frame used with reduced motion and as the favicon (64 px), and the favicon itself (32 and 16 px, from <code>favicon.svg</code>, generated by <code>tools/logos.mjs</code>).</p>
  <div class="grid" id="grid"></div>
</main>
<dialog id="info"><button class="icon-btn dlg-close" type="button" data-close>✕</button><h2>Logo gallery</h2><p>Review page for the animated lab logos (DESIGN.md §2).</p><p class="meta kit-meta"></p></dialog>
<script type="module">
import { initKit } from "./kit/kit.js";
initKit({ slug: "logos", name: "Logo Gallery", version: "0.1.0", sw: false, strings: { it: {}, en: {} } });
const { apps } = await (await fetch("apps.json")).json();
const grid = document.getElementById("grid");
for (const a of apps) {
  const r = await fetch(`${a.slug}/logo.svg`, { cache: "no-store" });
  if (!r.ok) continue;
  const svg = await r.text();
  const el = document.createElement("section");
  el.className = "item card";
  el.innerHTML = `<h2>${a.name}</h2><div class="row2">
    <figure class="big">${svg}<figcaption>animated</figcaption></figure>
    <figure class="mid still">${svg}<figcaption>still</figcaption></figure>
    <figure class="fav"><img src="${a.slug}/favicon.svg?${Date.now()}" alt=""><figcaption>32</figcaption></figure>
    <figure class="fav16"><img src="${a.slug}/favicon.svg?${Date.now()}" alt=""><figcaption>16</figcaption></figure></div>`;
  // the still copy: drop its <style> so no animation runs (like the favicon)
  el.querySelector(".still svg style")?.remove();
  grid.append(el);
}
</script>
</body>
</html>
