<ellipse cx="62" cy="65" rx="25" ry="10" fill="none" stroke="#2155CD" stroke-width="4"/>
<g class="slice"><ellipse cx="62" cy="44" rx="33" ry="13" fill="#6B2FD6" fill-opacity="0.3" stroke="#6B2FD6" stroke-width="5"/></g>
