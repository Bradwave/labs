<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Parameter Lab XR">
<title>Parameter Lab XR</title>
<style>
.slice { transform-box: fill-box; transform-origin: center; animation: slide 4.2s ease-in-out infinite alternate; }
.knob { animation: rise 4.2s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateY(42px) scale(0.42); } to { transform: none; } }
@keyframes rise { from { transform: translateY(42px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
