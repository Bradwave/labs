<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendulum Lab</title>
<meta name="description" content="Interactive pendulum simulator for physics teaching: forces and Newton's third law, energy, graphs, non-inertial frame, coupled and driven pendulums. In Italian and English.">
<meta name="theme-color" content="#8CCBEB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1630">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="top">
  <h1 class="word" aria-label="Pendulum Lab"><span class="k">p</span><span>e</span><span class="a">n</span><span>d</span><span class="b">u</span><span>l</span><span class="a">u</span><span class="b sw">m</span><b class="lab">lab</b></h1>
  <div class="top-actions">
    <button class="icon-btn" id="infoBtn" type="button"></button>
    <button class="icon-btn" id="settingsBtn" type="button"></button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="toolbar card">
      <button class="btn primary" id="playBtn" type="button" data-i18n-aria="pause"><span id="playIcon"></span><span class="lbl" id="playLbl" data-i18n="pause">Pausa</span></button>
      <button class="btn" id="stepBtn" type="button" data-ic="step" data-i18n-title="stepTip" data-i18n-aria="stepTip"><span class="lbl" data-i18n="step">Passo</span></button>
      <button class="btn" id="resetBtn" type="button" data-ic="reset" data-i18n-title="resetTip" data-i18n-aria="resetTip"><span class="lbl" data-i18n="reset">Azzera</span></button>
      <div class="seg small" id="speedSeg" role="group" data-i18n-aria="speed">
        <button type="button" data-v="0.1">⅒×</button><button type="button" data-v="0.25">¼×</button><button type="button" data-v="0.5">½×</button><button type="button" data-v="1" class="on">1×</button>
      </div>
      <span class="grow"></span>
      <div class="seg view" id="viewSeg" role="group" data-i18n-aria="view">
        <button type="button" data-v="lab" class="on" data-ic="axes" data-i18n-title="view.labTip"><span class="t" data-i18n="view.lab">Lab</span></button>
        <button type="button" data-v="ball" data-ic="target" data-i18n-title="view.ballTip"><span class="t" data-i18n="view.ball">Pallina</span></button>
      </div>
    </div>

    <div class="canvas-wrap card" id="wrap">
      <canvas id="cv" data-i18n-aria="canvas"></canvas>
      <div class="readout" id="readout"></div>
      <canvas id="ebars" data-i18n-aria="ebars"></canvas>
      <div class="hint" id="hint"></div>
    </div>

    <div class="quick card" id="quick" role="group" data-i18n-aria="quick"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" data-tab="graphs" role="tab" data-ic="chart"><span class="t" data-i18n="tab.graphs">Grafici</span></button>
      <button class="tab" type="button" data-tab="show" role="tab" data-ic="layers"><span class="t" data-i18n="tab.show">Mostra</span></button>
      <button class="tab" type="button" data-tab="setup" role="tab" data-ic="sliders"><span class="t" data-i18n="tab.setup">Imposta</span></button>
    </div>

    <div class="tabpane card" id="pane-graphs" role="tabpanel">
      <div class="gtop">
        <div class="seg small" id="gMode" role="group"><button type="button" data-v="time" class="on" data-i18n="g.time">Nel tempo</button><button type="button" data-v="phase" data-i18n="g.phase">Fase θ–ω</button></div>
        <div class="seg small" id="gWin" role="group"><button type="button" data-v="5">5 s</button><button type="button" data-v="10" class="on">10 s</button><button type="button" data-v="20">20 s</button></div>
      </div>
      <div class="gchips" id="gchips"></div>
      <canvas id="gcv" data-i18n-aria="g.canvas"></canvas>
      <table class="ptable" id="ptable"></table>
      <div class="csvrow"><button class="btn" id="csvBtn" type="button" data-ic="copy"><span data-i18n="csv.copy">Copia i dati in CSV</span></button><span class="note" data-i18n="csv.note">Tutte le grandezze registrate, 100 campioni al secondo</span></div>
      <textarea id="csvOut" class="field" hidden readonly data-i18n-aria="csv.aria"></textarea>
    </div>

    <div class="tabpane card" id="pane-show" role="tabpanel" hidden>
      <div id="showList"></div>
      <div class="ctl"><label for="arrowR"><span data-i18n="show.arrow">Dimensione delle frecce</span> <b id="arrowL"></b></label><input type="range" id="arrowR" min="0.4" max="2.5" step="0.05" value="1"></div>
    </div>

    <div class="tabpane card" id="pane-setup" role="tabpanel" hidden>
      <h3 class="grp" data-i18n="grp.rope">Filo</h3>
      <div class="seg full" id="modelSeg" role="group">
        <button type="button" data-v="rod" class="on" data-i18n="model.rod">Asta rigida</button><button type="button" data-v="string" data-i18n="model.string">Filo</button><button type="button" data-v="elastic" data-i18n="model.elastic">Elastico</button>
      </div>
      <p class="note" id="modelNote"></p>
      <div class="ctl" id="kCtl"><label for="kR"><span data-i18n="p.k">Rigidità k</span> <b id="kL"></b></label><input type="range" id="kR" min="0" max="100" step="1"></div>
      <div class="ctl"><label for="LR"><span data-i18n="p.L">Lunghezza L</span> <b id="LL"></b></label><input type="range" id="LR" min="0.1" max="5" step="0.05"></div>
      <div class="ctl" id="betaCtl"><label for="betaR"><span data-i18n="p.beta">Attrito al perno (solo asta)</span> <b id="betaL"></b></label><input type="range" id="betaR" min="0" max="0.5" step="0.005"></div>

      <h3 class="grp" data-i18n="grp.ball">Pallina e gravità</h3>
      <div class="ctl"><label for="mR"><span data-i18n="p.m">Massa m</span> <b id="mL"></b></label><input type="range" id="mR" min="0.05" max="5" step="0.05"></div>
      <div class="ctl"><label for="gR"><span data-i18n="p.g">Gravità g</span> <b id="gL"></b></label><input type="range" id="gR" min="0" max="30" step="0.01"></div>
      <div class="row">
        <span class="note" data-i18n="p.preset">Pianeta</span>
        <label class="sel"><select id="gSel" data-i18n-aria="p.preset">
          <option value="" data-i18n="planet.custom">Personalizzata</option>
          <option value="9.81" data-i18n="planet.earth">Terra</option>
          <option value="1.62" data-i18n="planet.moon">Luna</option>
          <option value="3.71" data-i18n="planet.mars">Marte</option>
          <option value="24.79" data-i18n="planet.jupiter">Giove</option>
          <option value="0" data-i18n="planet.zero">Zero</option>
        </select></label>
      </div>

      <h3 class="grp" data-i18n="grp.res">Resistenze</h3>
      <div class="ctl"><label for="cR"><span data-i18n="p.c">Resistenza dell'aria, cresce con v²</span> <b id="cL"></b></label><input type="range" id="cR" min="0" max="0.5" step="0.005"></div>
      <div class="ctl"><label for="bR"><span data-i18n="p.b">Attrito viscoso, cresce con v</span> <b id="bL"></b></label><input type="range" id="bR" min="0" max="2" step="0.01"></div>

      <h3 class="grp" data-i18n="grp.drive">Supporto oscillante</h3>
      <button class="tg" type="button" data-ly="drive"><span class="sw dot" style="background:var(--ink)"></span><span class="txt"><span data-i18n="tg.drive">Scuoti il supporto</span><small data-i18n="tg.driveHint"></small></span><span class="box"></span></button>
      <div id="driveBox">
        <div class="ctl"><label><span data-i18n="p.dir">Direzione</span></label><div class="seg small" id="dSeg" role="group"><button type="button" data-v="h" class="on" data-i18n="dir.h">Orizzontale</button><button type="button" data-v="v" data-i18n="dir.v">Verticale</button></div></div>
        <div class="ctl"><label for="dAR"><span data-i18n="p.dA">Ampiezza A</span> <b id="dAL"></b></label><input type="range" id="dAR" min="0.002" max="0.3" step="0.002"></div>
        <div class="ctl"><label for="dFR"><span data-i18n="p.dF">Frequenza f</span> <b id="dFL"></b></label><input type="range" id="dFR" min="0" max="100" step="0.1"></div>
        <div class="row"><button class="btn" id="dMatch" type="button" data-ic="sliders"><span data-i18n="btn.match">Porta a f₀</span></button></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="dRes" type="button" data-ic="waves"><span data-i18n="btn.res">Prova la risonanza</span></button>
        <button class="btn" id="dKap" type="button" data-ic="up"><span data-i18n="btn.kap">Prova Kapitza</span></button>
      </div>
      <p class="note" data-i18n="note.drive"></p>

      <h3 class="grp" data-i18n="grp.liquid">Liquido nella pallina</h3>
      <button class="tg" type="button" data-ly="fluid"><span class="sw dot" style="background:var(--liquid)"></span><span class="txt"><span data-i18n="tg.fluid">Riempi la pallina di liquido</span><small data-i18n="tg.fluidHint"></small></span><span class="box"></span></button>
      <div class="ctl"><label><span data-i18n="p.lq">Modello del liquido</span></label><div class="seg small" id="lqSeg" role="group"><button type="button" data-v="simple" class="on" data-i18n="lq.simple">Superficie</button><button type="button" data-v="particles" data-i18n="lq.particles">Particelle 2D</button></div></div>
      <div class="ctl"><label for="fillR"><span data-i18n="p.fill">Livello di riempimento</span> <b id="fillL"></b></label><input type="range" id="fillR" min="0.1" max="0.9" step="0.05"></div>
      <div class="ctl" id="zCtl"><label for="zR"><span id="zName" data-i18n="p.zeta">Smorzamento delle onde</span> <b id="zL"></b></label><input type="range" id="zR" min="0.02" max="0.8" step="0.01"></div>

      <h3 class="grp" data-i18n="grp.two">Secondo pendolo</h3>
      <button class="tg" type="button" data-ly="two"><span class="sw dot" style="background:var(--ball2)"></span><span class="txt"><span data-i18n="tg.two">Aggiungi il pendolo B</span><small data-i18n="tg.twoHint"></small></span><span class="box"></span></button>
      <div id="twoBox">
        <div class="ctl"><label><span data-i18n="p.link">Collegamento</span></label><div class="seg small" id="cpSeg" role="group"><button type="button" data-v="free" data-i18n="link.free">Indipendenti</button><button type="button" data-v="spring" class="on" data-i18n="link.spring">Molla</button></div></div>
        <div class="ctl"><label for="LBR"><span data-i18n-html="p.LB">Lunghezza L<sub>B</sub></span> <b id="LBL"></b></label><input type="range" id="LBR" min="0.1" max="5" step="0.05"></div>
        <div class="ctl"><label for="mBR"><span data-i18n-html="p.mB">Massa m<sub>B</sub></span> <b id="mBL"></b></label><input type="range" id="mBR" min="0.05" max="5" step="0.05"></div>
        <div class="ctl"><label for="dR"><span data-i18n="p.d">Distanza tra i supporti</span> <b id="dL"></b></label><input type="range" id="dR" min="0.2" max="3" step="0.05"></div>
        <div class="ctl" id="kapCtl"><label for="kapR"><span data-i18n="p.kap">Costante elastica κ</span> <b id="kapL"></b></label><input type="range" id="kapR" min="0" max="100" step="0.5"></div>
      </div>

      <h3 class="grp" data-i18n="grp.release">Lancio con i numeri</h3>
      <div class="row">
        <label class="num"><span>θ<sub>A</sub></span><input type="text" id="th0" value="40" data-step="1" data-min="-180" data-max="180"><span class="unit">°</span></label>
        <label class="num"><span>v<sub>A</sub></span><input type="text" id="v0" value="0" data-step="0.1" data-min="-30" data-max="30"><span class="unit">m/s</span></label>
        <label class="num" id="thBWrap"><span>θ<sub>B</sub></span><input type="text" id="thB" value="0" data-step="1" data-min="-180" data-max="180"><span class="unit">°</span></label>
        <button class="btn primary" id="relBtn" type="button" data-ic="launch"><span data-i18n="btn.release">Lancia</span></button>
      </div>
      <p class="note" data-i18n="note.release"></p>
    </div>
  </aside>
</main>

<dialog id="info">
  <button class="icon-btn dlg-close" type="button" data-close data-i18n-aria="kit.close">✕</button>
  <h1 class="word" aria-hidden="true"><span class="k">p</span><span>e</span><span class="a">n</span><span>d</span><span class="b">u</span><span>l</span><span class="a">u</span><span class="b">m</span><b class="lab">lab</b></h1>
  <p data-i18n="info.about"></p>
  <div data-i18n-html="help.body"></div>
  <p class="meta kit-meta"></p>
</dialog>
</body>
</html>
