<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Composition Lab XR">
<title>Composition Lab XR</title>
<style>
.dot { animation: go 4.2s ease-in-out infinite alternate; }
.up { animation: lift 4.2s ease-in-out infinite alternate; }
@keyframes go { from { transform: translateX(-26px); } to { transform: translateX(26px); } }
@keyframes lift { from { transform: translateY(24px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
