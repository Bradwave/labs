<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Collision Lab">
<title>Collision Lab</title>
<style>
/* equal masses, elastic, B at rest: after the hit they leave at a right angle (uniform motion, linear timing) */
.pa { animation: pa 3.2s linear infinite; }
.pb { animation: pb 3.2s linear infinite; }
@keyframes pa { 0% { transform: translate(0, 0); opacity: 1; } 40% { transform: translate(19.8px, 0); } 80%, 90% { transform: translate(24.8px, -8.6px); opacity: 1; } 100% { transform: translate(24.8px, -8.6px); opacity: 0; } }
@keyframes pb { 0%, 40% { transform: translate(0, 0); opacity: 1; } 80%, 90% { transform: translate(14.8px, 8.6px); opacity: 1; } 100% { transform: translate(14.8px, 8.6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="4" y="4" width="112" height="112" fill="#E0622A" stroke="#2A0E04" stroke-width="6"/>
<g fill="none" stroke="#2A0E04" stroke-width="3" stroke-dasharray="5 4" opacity="0.45">
<path d="M14 46H41.8L55 23.1"/>
<path d="M66 60L101 80.2"/>
</g>
<circle class="pb" cx="66" cy="60" r="14" fill="#7CC7F2" stroke="#2A0E04" stroke-width="4"/>
<circle class="pa" cx="22" cy="46" r="14" fill="#FFD23F" stroke="#2A0E04" stroke-width="4"/>
</svg>
