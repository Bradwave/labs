<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Detach Lab">
<title>Detach Lab</title>
<style>
.a1 { animation: a1 3.2s linear infinite; }
.a2 { animation: a2 3.2s linear infinite; }
.las { animation: las 3.2s linear infinite; }
.mk { animation: mk 3.2s linear infinite; }
@keyframes a1 { 0% { transform: translate(0, 0); opacity: 1; } 40% { transform: translate(26px, 0); } 80% { transform: translate(72px, -28px); opacity: 1; } 81%, 100% { transform: translate(72px, -28px); opacity: 0; } }
@keyframes a2 { 0% { transform: translate(0, 0); opacity: 1; } 40% { transform: translate(26px, 0); } 80% { transform: translate(72px, 28px); opacity: 1; } 81%, 100% { transform: translate(72px, 28px); opacity: 0; } }
@keyframes las { 0%, 36% { opacity: .35; } 40% { opacity: 1; } 48%, 100% { opacity: .35; } }
@keyframes mk { 0%, 79% { opacity: 0; } 80%, 96% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="4" y="4" width="112" height="112" fill="#9EE6A0" stroke="#0E2A12" stroke-width="6"/>
<line x1="10" y1="60" x2="96" y2="60" stroke="#0E2A12" stroke-width="2.5" stroke-dasharray="5 5"/>
<rect class="las" x="44" y="12" width="6" height="96" fill="#C2255C" opacity=".35"/>
<rect x="96" y="12" width="12" height="96" fill="#F4FBF4" stroke="#0E2A12" stroke-width="4"/>
<g class="mk"><rect x="97" y="28" width="10" height="8" fill="#C2255C"/><rect x="97" y="84" width="10" height="8" fill="#C2255C"/></g>
<g class="a1" transform="translate(49 -14)"><circle cx="18" cy="60" r="7" fill="#FFC24B" stroke="#0E2A12" stroke-width="3"/></g>
<g class="a2" transform="translate(49 14)"><circle cx="26" cy="60" r="7" fill="#FFC24B" stroke="#0E2A12" stroke-width="3"/></g>
</svg>
