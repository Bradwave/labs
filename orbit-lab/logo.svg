<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Orbit Lab">
<title>Orbit Lab</title>
<style>
.ship { transform-origin: 60px 60px; animation: orbit 4s linear infinite; }
@keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="4" y="4" width="112" height="112" fill="#6554D4" stroke="#14123A" stroke-width="6"/>
<circle cx="60" cy="60" r="40" fill="none" stroke="#F5F4FF" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="60" cy="60" r="22" fill="#F5F4FF" stroke="#14123A" stroke-width="5"/>
<rect x="57" y="30" width="6" height="10" fill="#14123A"/>
<g class="ship" transform="rotate(50 60 60)">
  <path d="M60 13 l9 7 -9 7 z" fill="#E8601C" stroke="#14123A" stroke-width="3" stroke-linejoin="round"/>
</g>
</svg>
