<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Carts Lab">
<title>Carts Lab</title>
<style>
.ca { animation: ca 4s linear infinite; }
.cb { animation: cb 4s linear infinite; }
.hit { animation: hit 4s linear infinite; opacity: 0; }
@keyframes ca { 0% { transform: translateX(0); } 25%, 75% { transform: translateX(12px); } 100% { transform: translateX(0); } }
@keyframes cb { 0%, 25% { transform: translateX(-12px); } 50% { transform: translateX(0); } 75%, 100% { transform: translateX(-12px); } }
@keyframes hit { 0%, 24% { opacity: 0; } 25% { opacity: 1; } 31%, 74% { opacity: 0; } 75% { opacity: 1; } 81%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="4" y="4" width="112" height="112" fill="#FF2E88" stroke="#2A0524" stroke-width="6"/>
<rect x="12" y="84" width="96" height="6" fill="#2A0524"/>
<rect x="12" y="54" width="6" height="36" fill="#2A0524"/>
<rect x="102" y="54" width="6" height="36" fill="#2A0524"/>
<g class="ca"><rect x="22" y="58" width="26" height="18" fill="#FFD60A" stroke="#2A0524" stroke-width="4"/><circle cx="29" cy="80" r="4" fill="#2A0524"/><circle cx="41" cy="80" r="4" fill="#2A0524"/></g>
<g class="cb" transform="translate(-12 0)"><rect x="72" y="58" width="26" height="18" fill="#FFF7FB" stroke="#2A0524" stroke-width="4"/><circle cx="79" cy="80" r="4" fill="#2A0524"/><circle cx="91" cy="80" r="4" fill="#2A0524"/></g>
<path class="hit" d="M60 30 l3 9 9 0 -7 6 3 9 -8 -5 -8 5 3 -9 -7 -6 9 0z" fill="#C6F500" stroke="#2A0524" stroke-width="2.5"/>
</svg>
