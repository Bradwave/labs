/* ---------- physics tokens: identical in every lab (DESIGN.md §3) ---------- */
:root {
  --pos: #2350d8;
  --vel: #0f9a63;
  --acc: #b42ba0;
  --force: #e2412a;
  --mom: #6e3fe0;
  --ek: #c27400;
  --ep: #1592b8;
  --neg: #e2412a;
  --pos-sign: #0f9a63;
  --err: #d0281b;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pos: #86a6ff;
    --vel: #3ddc97;
    --acc: #f27adf;
    --force: #ff7c60;
    --mom: #b59cff;
    --ek: #ffc15a;
    --ep: #6fd3f0;
    --neg: #ff7c60;
    --pos-sign: #3ddc97;
    --err: #ff6b5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pos: #86a6ff;
  --vel: #3ddc97;
  --acc: #f27adf;
  --force: #ff7c60;
  --mom: #b59cff;
  --ek: #ffc15a;
  --ep: #6fd3f0;
  --neg: #ff7c60;
  --pos-sign: #3ddc97;
  --err: #ff6b5e;
  color-scheme: dark;
}

/* ---------- base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--bgline) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--bgline) 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body.scrolls {
  overflow: auto;
  height: auto;
  min-height: 100%;
}
button,
select,
input,
textarea {
  font-family: inherit;
  color: inherit;
}
:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}
.num-t,
.ctl b,
.readout,
.ptable td {
  font-variant-numeric: tabular-nums;
}
/* kit icons: inline SVG, 20 px, stroke follows text colour */
.ki {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: square;
  stroke-linejoin: miter;
}
.ki .f {
  fill: currentColor;
  stroke: none;
}

/* ---------- header / app bar (DESIGN.md §5) ---------- */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding-block: 14px 2px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  flex: none;
}
.top-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  position: relative;
}
.word {
  display: flex;
  align-items: flex-end;
  margin: 0;
  font-size: clamp(20px, 2.6vw, 30px);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}
.word span {
  display: inline-grid;
  place-items: center;
  width: 1.32em;
  height: 1.32em;
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  margin-right: -2px;
  text-transform: lowercase;
}
.word span.a {
  background: var(--accent);
  color: var(--onaccent);
}
.word span.b {
  background: var(--tile2);
  color: var(--ink);
}
.word span.k {
  background: var(--ink);
  color: var(--surface);
}
.word .lab {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 5px 3px;
  font-size: 0.42em;
  line-height: 1;
  letter-spacing: 0.04em;
  background: var(--ink);
  color: var(--surface);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--accent);
  align-self: flex-end;
}
.word .lab + .lab {
  margin-left: 4px;
}
.icon-btn {
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  flex: none;
  padding: 0;
  touch-action: manipulation;
}
.icon-btn:active,
.icon-btn[aria-expanded="true"] {
  transform: translate(3px, 3px);
  box-shadow: none;
}

/* ---------- layout (DESIGN.md §4) ---------- */
.layout {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(330px, 440px);
  gap: 22px;
  max-width: 1400px;
  margin: 0 auto;
  padding-block: 12px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  background: var(--surface);
  border: 2px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
}
.stage {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  min-height: 0;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 10px;
  flex: none;
}
.canvas-wrap {
  position: relative;
  flex: 1;
  min-height: 160px;
  overflow: hidden;
}
.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.grow {
  flex: 1;
}
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

/* ---------- buttons ---------- */
.btn {
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  padding: 6px 10px;
  box-shadow: 3px 3px 0 var(--ink);
  display: inline-flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  min-height: 36px;
  white-space: nowrap;
  touch-action: manipulation;
}
.btn:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}
.btn.primary {
  background: var(--accent);
  color: var(--onaccent);
}
.btn.on {
  background: var(--ink);
  color: var(--surface);
}
.btn.ic {
  padding: 6px;
  min-width: 36px;
}
.btn[disabled],
.icon-btn[disabled] {
  opacity: 0.35;
  pointer-events: none;
}

/* ---------- segmented: 2–4 short options, never wraps ---------- */
.seg {
  display: inline-flex;
  flex-wrap: nowrap;
  border: 2px solid var(--ink);
  background: var(--surface);
  max-width: 100%;
}
.seg button {
  font-weight: 700;
  font-size: 12.5px;
  padding: 6px 11px;
  background: transparent;
  color: var(--ink);
  border: none;
  cursor: pointer;
  display: inline-flex;
  gap: 5px;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  white-space: nowrap;
  touch-action: manipulation;
}
.seg button + button {
  border-left: 2px solid var(--ink);
}
.seg button.on,
.seg button[aria-pressed="true"] {
  background: var(--ink);
  color: var(--surface);
}
.seg.small button {
  padding: 5px 9px;
  font-size: 11.5px;
  min-height: 28px;
}
.seg.full {
  display: flex;
}
.seg.full button {
  flex: 1;
}

/* ---------- select: styled closed box, native list (DESIGN.md §6) ---------- */
.sel {
  position: relative;
  display: inline-flex;
  max-width: 100%;
}
.sel select {
  font-size: 12.5px;
  font-weight: 700;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--ink);
  padding: 6px 30px 6px 9px;
  appearance: none;
  -webkit-appearance: none;
  border-radius: 0;
  box-shadow: 3px 3px 0 var(--ink);
  min-height: 36px;
  max-width: 100%;
  text-overflow: ellipsis;
  cursor: pointer;
}
.sel::after {
  content: "";
  position: absolute;
  right: 11px;
  top: 50%;
  width: 7px;
  height: 7px;
  margin-top: -6px;
  border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  transform: rotate(45deg);
  pointer-events: none;
}
.sel select:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}
/* customizable select where the browser supports it: same tile look for the open list */
@supports (appearance: base-select) {
  .sel select,
  .sel select::picker(select) {
    appearance: base-select;
  }
  .sel select::picker-icon {
    display: none;
  }
  .sel select::picker(select) {
    border: 2px solid var(--ink);
    background: var(--surface);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 0;
    margin-top: 4px;
  }
  .sel select option {
    padding: 8px 10px;
    font-size: 12.5px;
    font-weight: 700;
    border-bottom: 1px dotted var(--gridline);
  }
  .sel select option:checked {
    background: var(--ink);
    color: var(--surface);
  }
  .sel select option:hover {
    background: var(--tile2);
    color: var(--ink);
  }
  .sel select option::checkmark {
    display: none;
  }
}

/* ---------- switch row ---------- */
.tg {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px dotted var(--gridline);
  padding: 8px 2px;
  min-height: 44px;
  color: var(--ink);
  font-size: 12.5px;
  cursor: pointer;
  touch-action: manipulation;
}
.tg .txt {
  flex: 1;
  min-width: 0;
}
.tg .txt small {
  display: block;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.3;
}
.tg .box {
  width: 36px;
  height: 20px;
  border: 2px solid var(--ink);
  position: relative;
  flex: none;
  background: var(--surface);
}
.tg .box::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background: var(--ink);
  transition: left 0.15s ease-out;
}
.tg[aria-pressed="true"] .box {
  background: var(--accent);
}
.tg[aria-pressed="true"] .box::after {
  left: 18px;
  background: var(--onaccent);
}

/* ---------- checkbox: square box with an ink tick ---------- */
.chk {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  cursor: pointer;
  min-height: 32px;
}
.chk input {
  appearance: none;
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  margin: 0;
  border: 2px solid var(--ink);
  background: var(--surface);
  border-radius: 0;
  display: inline-grid;
  place-items: center;
  flex: none;
  cursor: pointer;
}
.chk input::after {
  content: "";
  width: 5px;
  height: 10px;
  border-right: 2.5px solid var(--onaccent);
  border-bottom: 2.5px solid var(--onaccent);
  transform: translateY(-1px) rotate(45deg);
  opacity: 0;
}
.chk input:checked {
  background: var(--accent);
}
.chk input:checked::after {
  opacity: 1;
}
.chk input:indeterminate::after {
  width: 10px;
  height: 0;
  border-right: none;
  border-bottom: 2.5px solid var(--ink);
  transform: none;
  opacity: 1;
}
.chk input:disabled {
  opacity: 0.35;
}

/* ---------- radio: same shape language, round because it is a choice dot ---------- */
.chk input[type="radio"] {
  border-radius: 50%;
}
.chk input[type="radio"]::after {
  width: 8px;
  height: 8px;
  border: none;
  background: var(--onaccent);
  border-radius: 50%;
  transform: none;
}

/* ---------- slider ---------- */
.ctl {
  margin: 10px 0;
}
.ctl label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}
.ctl b {
  color: var(--ink);
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  background: transparent;
  margin: 0;
  touch-action: pan-y;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  background: var(--ink);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  margin-top: -9px;
  background: var(--accent);
  border: 2px solid var(--ink);
  border-radius: 0;
  box-shadow: 2px 2px 0 var(--ink);
}
input[type="range"]::-moz-range-track {
  height: 4px;
  background: var(--ink);
}
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 0;
  background: var(--accent);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
input[type="range"]:disabled {
  opacity: 0.35;
}

/* ---------- number and text inputs: never type=number ---------- */
.num {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-size: 12.5px;
}
.num input,
input.field,
textarea.field {
  width: 86px;
  padding: 6px 8px;
  min-height: 36px;
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  border-radius: 0;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
input.field,
textarea.field {
  width: 100%;
}
.num input[aria-invalid="true"],
input.field[aria-invalid="true"] {
  border-color: var(--err);
  box-shadow: inset 0 0 0 1px var(--err);
}
.num .step {
  display: inline-flex;
}
.num .step input {
  border-left: none;
  border-right: none;
  text-align: center;
}
.num .step button {
  width: 32px;
  min-height: 36px;
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
}
.num .step button:active {
  background: var(--ink);
  color: var(--surface);
}
.num .unit {
  color: var(--muted);
}

/* ---------- chips ---------- */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.lg {
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  background: none;
  border: 1.5px solid var(--ink);
  color: var(--ink);
  padding: 6px 10px;
  min-height: 32px;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}
.lg:not(.on) {
  opacity: 0.45;
}
.lg .sw {
  width: 14px;
  height: 4px;
  background: currentColor;
}

/* ---------- tabs ---------- */
.tabs {
  display: flex;
  align-items: flex-end;
  flex: none;
}
.tab {
  font-weight: 700;
  font-size: 13px;
  padding: 9px 14px;
  border: 2px solid var(--ink);
  border-bottom: none;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  margin-right: -2px;
  opacity: 0.85;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  min-height: 44px;
  white-space: nowrap;
}
.tab.on,
.tab[aria-selected="true"] {
  background: var(--surface);
  opacity: 1;
  position: relative;
  z-index: 1;
  margin-bottom: -2px;
  padding-bottom: 11px;
}
.tabpane {
  padding: 12px 14px;
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
}
.tabs .kit-mini {
  display: none;
  margin-left: auto;
  gap: 6px;
  padding-bottom: 6px;
}
.tabs .kit-mini .icon-btn {
  width: 38px;
  height: 38px;
  box-shadow: 2px 2px 0 var(--ink);
}
h3.grp {
  font-size: 12px;
  margin: 16px 0 6px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
h3.grp:first-child {
  margin-top: 2px;
}
.note {
  font-size: 11.5px;
  color: var(--muted);
  margin: 6px 0;
}

/* ---------- canvas helpers ---------- */
.hint {
  position: absolute;
  left: 10px;
  bottom: 10px;
  font-size: 11px;
  color: var(--muted);
  pointer-events: none;
  background: var(--surface);
  padding: 2px 7px;
  border: 1.5px solid var(--gridline);
  max-width: calc(100% - 20px);
}
.hint:empty {
  display: none;
}
.readout {
  position: absolute;
  right: 10px;
  top: 10px;
  display: grid;
  grid-template-columns: auto auto;
  gap: 1px 10px;
  font-size: 11.5px;
  background: var(--surface);
  border: 1.5px solid var(--ink);
  padding: 5px 8px;
  pointer-events: none;
}
.readout b {
  text-align: right;
}

/* ---------- toast ---------- */
.kit-toast {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translate(-50%, -8px);
  background: var(--ink);
  color: var(--surface);
  padding: 8px 12px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.25s ease-out,
    transform 0.25s ease-out;
  max-width: min(88vw, 520px);
  text-align: center;
  z-index: 50;
}
.kit-toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- menu (settings) ---------- */
.menu {
  position: fixed;
  right: 16px;
  top: 64px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  width: 280px;
  max-width: calc(100vw - 24px);
  padding: 6px 10px;
}
.menu .mrow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dotted var(--gridline);
  font-size: 12.5px;
  font-weight: 700;
}
.menu .mrow > span {
  flex: 1;
}
.menu .seg {
  flex: none;
}
.menu button.mitem {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px dotted var(--gridline);
  color: var(--ink);
  padding: 10px 0;
  min-height: 44px;
  font-size: 12.5px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}
.menu button.mitem b {
  margin-left: auto;
  font-weight: 400;
  color: var(--muted);
}
.menu .msep {
  height: 2px;
  background: var(--ink);
  margin: 4px 0;
}
.menu .mver {
  font-size: 10.5px;
  color: var(--muted);
  padding: 8px 0 4px;
}
.menu > :last-child {
  border-bottom: none;
}

/* ---------- dialogs ---------- */
dialog {
  border: 2px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  background: var(--surface);
  color: var(--ink);
  max-width: min(660px, 94vw);
  max-height: 88dvh;
  padding: 18px 20px;
  font-family: inherit;
}
dialog::backdrop {
  background: rgba(0, 0, 0, 0.45);
}
dialog h2 {
  margin: 14px 0 6px;
  font-size: 22px;
  letter-spacing: -0.03em;
}
dialog h3 {
  font-size: 13px;
  color: var(--accent);
  margin: 16px 0 4px;
}
dialog p,
dialog li {
  font-size: 12.5px;
}
dialog ul {
  padding-left: 18px;
  margin: 4px 0;
}
dialog .dlg-close {
  float: right;
}
dialog .word {
  font-size: 22px;
}
dialog .meta {
  margin-top: 16px;
  padding-top: 10px;
  border-top: 1px dotted var(--gridline);
  font-size: 11px;
  color: var(--muted);
}
kbd {
  font-family: inherit;
  font-size: 10px;
  border: 1px solid currentColor;
  padding: 0 3px;
}
@media (hover: none) {
  kbd {
    display: none;
  }
}

/* ---------- table ---------- */
.ptable {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}
.ptable th {
  position: sticky;
  top: 0;
  background: var(--surface);
  border-bottom: 2px solid var(--ink);
  text-align: right;
  padding: 4px 6px;
}
.ptable td {
  text-align: right;
  padding: 3px 6px;
  border-bottom: 1px dotted var(--gridline);
}
.ptable tr.cur td {
  background: var(--tile2);
  color: var(--ink);
}

/* ---------- phone portrait: app bar, stacked layout ---------- */
@media (max-width: 920px) and (orientation: portrait) {
  .top {
    padding-block: 6px 0;
    padding-left: max(8px, env(safe-area-inset-left, 0px));
    padding-right: max(8px, env(safe-area-inset-right, 0px));
    min-height: 48px;
  }
  .word {
    font-size: 17px;
  }
  .top .icon-btn {
    width: 40px;
    height: 40px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .layout {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-block: 8px 10px;
    padding-left: max(8px, env(safe-area-inset-left, 0px));
    padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .stage {
    flex: 1;
    gap: 8px;
  }
  .panel {
    flex: none;
    height: clamp(220px, 38dvh, 560px);
  }
  .card {
    box-shadow: 4px 4px 0 var(--ink);
  }
  .toolbar {
    padding: 6px;
    gap: 6px;
  }
  .btn .lbl {
    display: none;
  }
  .tab {
    padding: 7px 12px;
    font-size: 12.5px;
  }
  .tab.on,
  .tab[aria-selected="true"] {
    padding-bottom: 9px;
  }
  .hint {
    display: none;
  }
  /* settings as a bottom sheet */
  .menu {
    position: fixed;
    left: 8px;
    right: 8px;
    top: auto;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: auto;
    max-width: none;
    max-height: 75dvh;
    overflow: auto;
  }
}

/* ---------- short landscape: no header, buttons in the tab row ---------- */
@media (max-height: 600px) and (orientation: landscape) {
  .top {
    display: none;
  }
  .tabs .kit-mini {
    display: flex;
  }
  .layout {
    padding-block: 8px;
    gap: 14px;
    grid-template-columns: minmax(0, 1fr) minmax(290px, 380px);
  }
  .card {
    box-shadow: 4px 4px 0 var(--ink);
  }
  .toolbar {
    padding: 6px;
    gap: 6px;
  }
  .btn .lbl,
  .hint {
    display: none;
  }
  .menu {
    position: fixed;
    right: 8px;
    top: 8px;
    max-height: calc(100dvh - 16px);
    overflow: auto;
  }
}

/* ---------- narrow: icon-only tabs ---------- */
@media (max-width: 540px) {
  .tab .t {
    display: none;
  }
  .tab {
    padding: 7px 14px;
  }
  .tab.on .t,
  .tab[aria-selected="true"] .t {
    display: inline;
  }
}

/* ---------- touch: 44 px targets ---------- */
@media (pointer: coarse) {
  .btn,
  .seg button,
  .seg.small button,
  .lg,
  .num input,
  .num .step button,
  .sel select,
  input.field {
    min-height: 44px;
  }
  .btn.ic,
  .seg button {
    min-width: 42px;
  }
  .chk {
    min-height: 44px;
  }
  .chk input {
    width: 24px;
    height: 24px;
  }
  .icon-btn {
    width: 44px;
    height: 44px;
  }
  input[type="range"] {
    height: 36px;
  }
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}

<script type="module">
// ===== kit/kit.js =====
// lab-kit · kit.js
// Shared behaviour of the labs: language, theme, settings menu, info dialog, slider guard, number inputs,
// toast, storage, colours for canvas, service worker and install. See DESIGN.md §5–8, §14–15.
// Generated copy in each app: edit lab-kit/kit/kit.js, then run tools/sync-kit.mjs.

const KIT_VERSION = "0.1.0";

// ---------- kit strings ----------
const KIT_STRINGS = {
  it: {
    "kit.info": "Informazioni",
    "kit.settings": "Impostazioni",
    "kit.lang": "Lingua",
    "kit.theme": "Tema",

  strings: { it: {}, en: {} },

  guardSliders: true,

let lang = "it";
let theme = "auto";
const langListeners = [];
const themeListeners = [];
let menuEl = null;
let installEvent = null;

// ---------- storage: every key starts with the slug (DESIGN.md §14) ----------
const store = {
  get(name) {
    try {
      return localStorage.getItem(`${cfg.slug}.${name}`);
    } catch (e) {
      return null;
    }
  },
  set(name, value) {
    try {
      localStorage.setItem(`${cfg.slug}.${name}`, value);
    } catch (e) {
      /* the page works without storage */
    }
  },
  remove(name) {
    try {
      localStorage.removeItem(`${cfg.slug}.${name}`);
    } catch (e) {
      /* ignore */
    }
  },
  getJSON(name, fallback = null) {
    const s = this.get(name);
    if (s == null) return fallback;
    try {
      return JSON.parse(s);
    } catch (e) {
      return fallback;
    }
  },
  setJSON(name, value) {
    this.set(name, JSON.stringify(value));
  },
};

// ---------- language ----------
function pickLang() {
  const saved = store.get("lang");
  if (saved === "it" || saved === "en") return saved;
  const nav = (typeof navigator !== "undefined" && navigator.language) || "it";
  return nav.toLowerCase().startsWith("it") ? "it" : "en";
}
function getLang() {
  return lang;
}
function t(key, params) {
  let s = dict[lang][key] ?? dict.en[key] ?? dict.it[key] ?? key;
  if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? params[k] : m));
  return s;
}
function applyI18n(root = document) {
  if (root === document) document.documentElement.lang = lang;
  for (const el of root.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of root.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of root.querySelectorAll("[data-i18n-title]")) el.title = t(el.dataset.i18nTitle);
  for (const el of root.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  for (const el of root.querySelectorAll("[data-i18n-placeholder]")) el.placeholder = t(el.dataset.i18nPlaceholder);
}
function setLang(l) {
  if (l !== "it" && l !== "en") return;
  lang = l;
  store.set("lang", l);
  applyI18n();
  if (menuEl) renderMenu();
  langListeners.forEach((fn) => fn(l));
}
function onLang(fn) {
  langListeners.push(fn);
}

// ---------- theme ----------
const darkQuery = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
function getTheme() {
  return theme;
}
function isDark() {
  return theme === "dark" || (theme === "auto" && !!darkQuery && darkQuery.matches);
}
function applyTheme() {
  const root = document.documentElement;
  if (theme === "auto") root.removeAttribute("data-theme");
  else root.dataset.theme = theme;
  // browser chrome colour follows the page background
  const bg = getComputedStyle(root).getPropertyValue("--bg").trim();
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) {
    if (m.dataset.orig === undefined) m.dataset.orig = m.content;
    m.content = theme === "auto" ? m.dataset.orig : bg || m.dataset.orig;
  }
  themeListeners.forEach((fn) => fn(isDark()));
}
function setTheme(v) {
  if (!["auto", "light", "dark"].includes(v)) return;
  theme = v;
  store.set("theme", v);
  applyTheme();
  if (menuEl) renderMenu();
}
function onTheme(fn) {
  themeListeners.push(fn);
}

// Every token as { name: value } for canvas and SVG drawing (DESIGN.md §8).
const TOKENS = [
  "bg", "bgline", "surface", "ink", "muted", "accent", "onaccent", "tile2", "gridline",
  "pos", "vel", "acc", "force", "mom", "ek", "ep", "neg", "pos-sign", "err",
];
function readColors(extra = []) {
  const cs = getComputedStyle(document.documentElement);
  const out = {};
  for (const n of TOKENS.concat(extra)) out[n.replace(/-(\w)/g, (m, c) => c.toUpperCase())] = cs.getPropertyValue("--" + n).trim();
  return out;
}

// ---------- numbers (DESIGN.md §6) ----------
// "0,5" → 0.5 · "−2.25" → -2.25 · "1 250,5" → 1250.5 · "3,2×10^-4" → 0.00032 · "" → NaN
function parseNum(input) {
  if (typeof input === "number") return input;
  let s = String(input ?? "").trim();
  if (!s) return NaN;
  s = s.replace(/[−‒–]/g, "-").replace(/[\s   ']/g, "");
  s = s.replace(/[×x·*]10\^?(-?\d+)$/i, "e$1").replace(/⁻/g, "-");
  const lastComma = s.lastIndexOf(","),
    lastDot = s.lastIndexOf(".");
  if (lastComma >= 0 && lastDot >= 0) {
    if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (lastComma >= 0) {
    if ((s.match(/,/g) || []).length > 1) return NaN;
    s = s.replace(",", ".");
  }
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
  return Number(s);
}
// fmtNum(-1.5, 2) → "−1,50" in Italian, "−1.50" in English; unit is added after a thin space.
function fmtNum(x, digits = 2, unit = "") {
  if (x == null || !Number.isFinite(x)) return "—";
  let s = Math.abs(x) < 0.5 * Math.pow(10, -digits) ? (0).toFixed(digits) : x.toFixed(digits);
  if (lang === "it") s = s.replace(".", ",");
  s = s.replace("-", "−");
  return unit ? `${s} ${unit}` : s;
}
// 3.2e-4 → "3,2 × 10⁻⁴"
const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
function fmtSci(x, digits = 2) {
  if (x == null || !Number.isFinite(x)) return "—";
  if (x === 0) return fmtNum(0, digits);
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x / Math.pow(10, e);
  if (e === 0) return fmtNum(x, digits);
  return `${fmtNum(m, digits)} × 10${String(e).replace(/./g, (c) => SUP[c])}`;
}
// Round tick values for an axis (DESIGN.md §10).
function niceTicks(min, max, n = 6) {
  if (!(max > min)) return [min];
  const raw = (max - min) / Math.max(1, n);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : +v.toPrecision(12));
  return out;
}

function enhanceNumbers(root = document) {
  for (const input of root.querySelectorAll(".num input")) {
    if (input.dataset.kit) continue;
    input.dataset.kit = "1";
    if (input.type === "text" && !input.inputMode) input.inputMode = "decimal";
    input.addEventListener("change", () => {
      const bad = input.value.trim() !== "" && Number.isNaN(parseNum(input.value));
      input.setAttribute("aria-invalid", bad ? "true" : "false");
      if (bad) toast(t("kit.badNumber"));
    });
    if (input.dataset.step == null) continue;
    const wrap = document.createElement("span");
    wrap.className = "step";
    input.replaceWith(wrap);
    const mk = (sign) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = sign < 0 ? "−" : "+";
      b.setAttribute("aria-label", sign < 0 ? "−" : "+");
      b.addEventListener("click", () => {
        const step = parseNum(input.dataset.step) || 1;
        let v = parseNum(input.value);
        if (Number.isNaN(v)) v = 0;
        v += sign * step;
        if (input.dataset.min != null) v = Math.max(parseNum(input.dataset.min), v);
        if (input.dataset.max != null) v = Math.min(parseNum(input.dataset.max), v);
        const d = input.dataset.digits != null ? +input.dataset.digits : (String(input.dataset.step).split(/[.,]/)[1] || "").length;
        input.value = fmtNum(v, d);
        input.setAttribute("aria-invalid", "false");
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
      });
      return b;
    };
    wrap.append(mk(-1), input, mk(1));
  }
}

// ---------- slider guard (DESIGN.md §6) ----------
// On touch a range input only changes after the finger has moved 8 px sideways, more sideways than vertically.
// Vertical swipes that start on a slider scroll the page; a tap on the track does not jump the value.
function guardSliders() {
  if (document.documentElement.dataset.kitGuard) return;
  document.documentElement.dataset.kitGuard = "1";
  let g = null;
  const isRange = (el) => el instanceof HTMLInputElement && el.type === "range";
  document.addEventListener(
    "pointerdown",
    (e) => {
      if (e.pointerType !== "touch" || !isRange(e.target)) return;
      g = { el: e.target, id: e.pointerId, x: e.clientX, y: e.clientY, start: e.target.value, engaged: false };
    },
    true,
  );
  document.addEventListener(
    "pointermove",
    (e) => {
      if (!g || g.engaged || e.pointerId !== g.id) return;
      const dx = Math.abs(e.clientX - g.x),
        dy = Math.abs(e.clientY - g.y);
      if (dx >= 8 && dx > dy) g.engaged = true;
    },
    true,
  );
  const block = (e) => {
    if (!g || g.engaged || e.target !== g.el) return;
    g.el.value = g.start;
    e.stopImmediatePropagation();
  };
  document.addEventListener("input", block, true);
  document.addEventListener("change", block, true);
  const end = (e) => {
    if (!g || e.pointerId !== g.id) return;
    if (!g.engaged) g.el.value = g.start;
    g = null;
  };
  document.addEventListener("pointerup", end, true);
  document.addEventListener("pointercancel", end, true);
}

// ---------- toast ----------
let toastEl = null,
  toastTimer = 0;
function toast(msg, ms = 2400) {
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.className = "kit-toast";
    toastEl.setAttribute("role", "status");
    toastEl.setAttribute("aria-live", "polite");
    document.body.append(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
}

// ---------- header buttons, info dialog, settings menu (DESIGN.md §5) ----------
const desktopQuery = "(min-width: 921px), (orientation: landscape) and (min-height: 601px)";

function openInfo() {
  const dlg = document.getElementById("info");
  if (!dlg) return;
  const meta = dlg.querySelector(".kit-meta");
  if (meta)
    meta.innerHTML = `${t("kit.privacy")}<br>${cfg.name} v${cfg.version} · kit ${KIT_VERSION} · ${t("kit.license")} · <a href="${cfg.landing}" target="_blank" rel="noopener">${t("kit.more")}</a>`;
  dlg.showModal();
}

function renderMenu() {
  const seg = (name, value, options) =>
    `<div class="seg small" role="group" aria-label="${t("kit." + name)}">` +
    options
      .map(([v, label, ic]) => `<button type="button" data-kit-${name}="${v}" class="${v === value ? "on" : ""}" aria-pressed="${v === value}" title="${label}">${ic ? icon(ic) : label}</button>`)
      .join("") +
    "</div>";
  let html = "";
  html += `<div class="mrow">${icon("lang")}<span>${t("kit.lang")}</span>${seg("lang", lang, [["it", "IT"], ["en", "EN"]])}</div>`;
  html += `<div class="mrow">${icon(isDark() ? "dark" : "light")}<span>${t("kit.theme")}</span>${seg("theme", theme, [
    ["auto", t("kit.theme.auto"), "auto"],
    ["light", t("kit.theme.light"), "light"],
    ["dark", t("kit.theme.dark"), "dark"],
  ])}</div>`;
  const items = cfg.menu.filter((it) => !it.hidden || !it.hidden());
  if (items.length) {
    html += '<div class="msep" role="separator"></div>';
    items.forEach((it, i) => {
      const val = it.value ? `<b>${it.value()}</b>` : "";
      html += `<button type="button" class="mitem" data-kit-item="${i}">${icon(it.icon || "settings")}<span>${t(it.label)}</span>${val}</button>`;
    });
  }
  html += '<div class="msep" role="separator"></div>';
  if (installEvent) html += `<button type="button" class="mitem" data-kit-install>${icon("install")}<span>${t("kit.install")}</span></button>`;
  html += `<div class="mver">${cfg.name} v${cfg.version} · kit ${KIT_VERSION}</div>`;
  menuEl.innerHTML = html;
  menuEl._items = items;
}

function placeMenu(btn) {
  if (matchMedia(desktopQuery).matches) {
    const r = btn.getBoundingClientRect();
    menuEl.style.top = `${r.bottom + 10}px`;
    menuEl.style.right = `${Math.max(8, innerWidth - r.right)}px`;
  } else {
    menuEl.style.top = "";
    menuEl.style.right = "";
  }
}

let menuBtn = null;
function openMenu(btn) {
  menuBtn = btn;
  renderMenu();
  menuEl.hidden = false;
  placeMenu(btn);
  for (const b of document.querySelectorAll("[data-kit-settings]")) b.setAttribute("aria-expanded", "true");
  const first = menuEl.querySelector("button");
  if (first) first.focus({ preventScroll: true });
}
function closeMenu(refocus = true) {
  if (!menuEl || menuEl.hidden) return;
  menuEl.hidden = true;
  for (const b of document.querySelectorAll("[data-kit-settings]")) b.setAttribute("aria-expanded", "false");
  if (refocus && menuBtn) menuBtn.focus({ preventScroll: true });
}

function setupHeader() {
  const info = document.getElementById("infoBtn");
  const gear = document.getElementById("settingsBtn");
  menuEl = document.createElement("div");
  menuEl.className = "menu card";
  menuEl.id = "kitMenu";
  menuEl.hidden = true;
  menuEl.setAttribute("role", "menu");
  document.body.append(menuEl);

  const wire = (b, kind) => {
    if (!b) return;
    if (!b.innerHTML.trim()) b.innerHTML = icon(kind);
    b.dataset.i18nAria = b.dataset.i18nAria || `kit.${kind}`;
    b.dataset.i18nTitle = b.dataset.i18nTitle || `kit.${kind}`;
    if (kind === "settings") {
      b.dataset.kitSettings = "1";
      b.setAttribute("aria-haspopup", "menu");
      b.setAttribute("aria-controls", "kitMenu");
      b.setAttribute("aria-expanded", "false");
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        menuEl.hidden ? openMenu(b) : closeMenu();
      });
    } else b.addEventListener("click", openInfo);
  };
  wire(info, "info");
  wire(gear, "settings");

  // short landscape: the header is hidden, so the two buttons are cloned into the tab row
  const tabs = document.querySelector(".tabs");
  if (tabs && (info || gear) && !tabs.querySelector(".kit-mini")) {
    const mini = document.createElement("div");
    mini.className = "kit-mini";
    for (const [src, kind] of [[info, "info"], [gear, "settings"]]) {
      if (!src) continue;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "icon-btn";
      mini.append(b);
      wire(b, kind);
    }
    tabs.append(mini);
  }

  menuEl.addEventListener("click", (e) => {
    e.stopPropagation(); // the menu re-renders on lang/theme: its old buttons must not count as outside clicks
    const el = e.target.closest("button");
    if (!el) return;
    if (el.dataset.kitLang) return setLang(el.dataset.kitLang);
    if (el.dataset.kitTheme) return setTheme(el.dataset.kitTheme);
    if (el.dataset.kitInstall !== undefined) {
      closeMenu();
      installEvent.prompt();
      installEvent.userChoice.then(() => (installEvent = null));
      return;
    }
    if (el.dataset.kitItem !== undefined) {
      const it = menuEl._items[+el.dataset.kitItem];
      if (!it) return;
      if (it.keepOpen) {
        it.onClick();
        renderMenu();
      } else {
        closeMenu();
        it.onClick();
      }
    }
  });
  document.addEventListener("click", (e) => {
    if (menuEl.hidden || menuEl.contains(e.target)) return;
    closeMenu(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });
  addEventListener("resize", () => {
    if (!menuEl.hidden && menuBtn) placeMenu(menuBtn);
  });

  for (const b of document.querySelectorAll("dialog [data-close]"))
    b.addEventListener("click", () => b.closest("dialog").close());
}

// ---------- service worker and install (DESIGN.md §15) ----------
function setupPWA() {
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installEvent = e;
  });
  addEventListener("appinstalled", () => {
    installEvent = null;
    toast(t("kit.installed"));
  });
  if (!cfg.sw || !("serviceWorker" in navigator) || location.protocol === "file:") return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController) toast(t("kit.updated"), 6000);
  });
}

// ---------- init ----------
// initKit({ slug, name, version, strings: { it, en }, menu: [{ icon, label, onClick, value?, hidden?, keepOpen? }] })
function initKit(options = {}) {
  Object.assign(cfg, options);
  dict = {
    it: { ...KIT_STRINGS.it, ...(cfg.strings.it || {}) },
    en: { ...KIT_STRINGS.en, ...(cfg.strings.en || {}) },
  };
  lang = pickLang();
  const savedTheme = store.get("theme");
  theme = ["auto", "light", "dark"].includes(savedTheme) ? savedTheme : "auto";
  setupHeader();
  applyTheme();
  applyI18n();
  if (darkQuery) darkQuery.addEventListener("change", () => theme === "auto" && applyTheme());
  if (cfg.guardSliders) guardSliders();
  enhanceNumbers(document);
  setupPWA();
  return { t, getLang, setLang, onLang, getTheme, setTheme, onTheme, isDark, readColors, toast, store };
}

// ===== kit/mathtext.js =====
// lab-kit · mathtext.js
// Tiny maths markup (from Crackler): v_x, a_{max}, m/s^2, \theta. Renders to HTML, SVG, plain text and canvas.
// No dependencies; this is not LaTeX: only subscripts, superscripts and Greek letters.

const GREEK = {
  alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", zeta: "ζ", eta: "η", theta: "θ",
  kappa: "κ", lambda: "λ", mu: "μ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ", tau: "τ",
  phi: "φ", chi: "χ", psi: "ψ", omega: "ω", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Sigma: "Σ",
  Phi: "Φ", Psi: "Ψ", Omega: "Ω",
};

// ---------- parsing ----------
// Returns [{ t: text, m: "" | "sub" | "sup" }].
function parse(src) {
  const out = [];
  const s = String(src);
  const push = (t, m) => {
    if (!t) return;
    const last = out[out.length - 1];
    if (last && last.m === m) last.t += t;
    else out.push({ t, m });
  };
  const readGroup = (i) => {
    // reads {...} or a single token after _ or ^; returns [text, nextIndex]
    if (s[i] === "{") {
      const j = s.indexOf("}", i);
      const end = j < 0 ? s.length : j;
      return [s.slice(i + 1, end), end + 1];
    }
    if (s[i] === "\\") {
      const m = /^\\[A-Za-z]+/.exec(s.slice(i));
      return m ? [m[0], i + m[0].length] : [s[i] ?? "", i + 1];
    }
    if (i >= s.length) return ["", i];
    return [s[i], i + 1];
  };
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === "_" || c === "^") {
      const [g, j] = readGroup(i + 1);
      push(greek(g), c === "_" ? "sub" : "sup");
      i = j;
    } else if (c === "\\") {
      const m = /^\\([A-Za-z]+)/.exec(s.slice(i));
      if (m) {
        push(GREEK[m[1]] ?? m[0], "");
        i += m[0].length;
      } else {
        push(c, "");
        i++;
      }
    } else {
      push(c, "");
      i++;
    }
  }
  return out;
}
function greek(g) {
  return g.replace(/\\([A-Za-z]+)/g, (m, n) => GREEK[n] ?? m);
}

// ---------- renderers ----------
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function toHTML(src) {
  return parse(src)
    .map((p) => (p.m ? `<${p.m}>${esc(p.t)}</${p.m}>` : esc(p.t)))
    .join("");
}
function toSVG(src, size = 11) {
  const small = Math.round(size * 0.72);
  return parse(src)
    .map((p) =>
      p.m
        ? `<tspan baseline-shift="${p.m === "sub" ? "sub" : "super"}" font-size="${small}">${esc(p.t)}</tspan>`
        : esc(p.t),
    )
    .join("");
}
// "v_x" -> "v_x", "\theta" -> "θ": readable in CSV headers and aria-labels.
function plain(src) {
  return parse(src)
    .map((p) => (p.m === "sub" ? "_" + p.t : p.m === "sup" ? "^" + p.t : p.t))
    .join("");
}

// ---------- canvas ----------
// opts: size (px), weight, family, align ("left" | "center" | "right"), color
const FAMILY = '"Space Mono", ui-monospace, Menlo, Consolas, monospace';
function fontOf(opts, px) {
  return `${opts.weight || 400} ${px}px ${opts.family || FAMILY}`;
}
function measureMath(ctx, src, opts = {}) {
  const size = opts.size || 12;
  let w = 0;
  for (const p of parse(src)) {
    ctx.font = fontOf(opts, p.m ? size * 0.72 : size);
    w += ctx.measureText(p.t).width;
  }
  return w;
}
// Draws at (x, y) on the text baseline; returns the width.
function drawMath(ctx, src, x, y, opts = {}) {
  const size = opts.size || 12,
    total = measureMath(ctx, src, opts);
  let cx = x;
  if (opts.align === "center") cx = x - total / 2;
  else if (opts.align === "right") cx = x - total;
  const startX = cx;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  for (const p of parse(src)) {
    ctx.font = fontOf(opts, p.m ? size * 0.72 : size);
    const dy = p.m === "sub" ? size * 0.22 : p.m === "sup" ? -size * 0.4 : 0;
    if (opts.halo) {
      ctx.lineJoin = "round";
      ctx.lineWidth = 3;
      ctx.strokeStyle = opts.halo;
      ctx.strokeText(p.t, cx, y + dy);
    }
    if (opts.color) ctx.fillStyle = opts.color;
    ctx.fillText(p.t, cx, y + dy);
    cx += ctx.measureText(p.t).width;
  }
  return cx - startX;
}

// ===== js/main.js =====
// New Lab · main.js
// Entry point: kit setup, tabs, a minimal simulation loop to replace with the real one.


const VERSION = "0.1.0";

initKit({ sw: false,
  slug: "new-lab",
  name: "New Lab",
  version: VERSION,
  strings: STRINGS,
  menu: [
    { icon: "link", label: "menu.share", onClick: () => navigator.clipboard?.writeText(location.href).then(() => toast(t("copied"))) },
    { icon: "reset", label: "menu.reset", onClick: () => { store.remove("state"); location.hash = ""; location.reload(); } },
  ],
});

// ---------- icons and tabs ----------
for (const b of document.querySelectorAll("[data-ic]")) b.insertAdjacentHTML("afterbegin", icon(b.dataset.ic));
const tabs = [...document.querySelectorAll(".tab")];
function showTab(i) {
  tabs.forEach((b, j) => {
    b.setAttribute("aria-selected", String(i === j));
    document.getElementById(b.getAttribute("aria-controls")).hidden = i !== j;
  });
}
tabs.forEach((b, i) => b.addEventListener("click", () => showTab(i)));

// ---------- state ----------
const S = { x: 0, v: 2, t: 0, running: false, vectors: true };

const $ = (id) => document.getElementById(id);
const v0 = $("v0"),
  x0 = $("x0");
function syncUI() {
  $("v0Out").textContent = fmtNum(+v0.value, 1, "m/s");
  $("clock").textContent = `t = ${fmtNum(S.t, 2, "s")}`;
  $("playBtn").querySelector(".lbl").textContent = t(S.running ? "pause" : "play");
}
v0.addEventListener("input", () => { S.v = +v0.value; syncUI(); draw(); });
x0.addEventListener("change", () => { const v = parseNum(x0.value); if (!Number.isNaN(v)) S.x = v; draw(); });
$("tgVec").addEventListener("click", (e) => {
  S.vectors = !S.vectors;
  e.currentTarget.setAttribute("aria-pressed", String(S.vectors));
  draw();
});
$("playBtn").addEventListener("click", () => { S.running = !S.running; syncUI(); if (S.running) requestAnimationFrame(loop); });
$("stepBtn").addEventListener("click", () => { advance(1 / 30); });
$("resetBtn").addEventListener("click", () => { S.t = 0; S.running = false; syncUI(); draw(); });

// ---------- simulation: fixed physics step, rendering at display rate (DESIGN.md §12) ----------
let last = 0;
function advance(dt) {
  S.t += dt;
  syncUI();
  draw();
}
function loop(now) {
  if (!S.running) return (last = 0);
  if (last) advance(Math.min(0.05, (now - last) / 1000));
  last = now;
  requestAnimationFrame(loop);
}

// ---------- drawing ----------
const cv = $("cv");
let C = readColors();
function draw() {
  const r = cv.getBoundingClientRect(),
    dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr;
  cv.height = r.height * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  const scale = r.width / 24,
    x = r.width / 2 + (S.x + S.v * S.t) * scale,
    y = r.height / 2;
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y + 14);
  ctx.lineTo(r.width, y + 14);
  ctx.stroke();
  ctx.fillStyle = C.tile2;
  ctx.fillRect(x - 14, y - 14, 28, 28);
  ctx.strokeRect(x - 14, y - 14, 28, 28);
  if (S.vectors && S.v) {
    const len = S.v * scale;
    ctx.strokeStyle = ctx.fillStyle = C.vel;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y - 24);
    ctx.lineTo(x + len, y - 24);
    ctx.stroke();
    const d = Math.sign(len);
    ctx.beginPath();
    ctx.moveTo(x + len + d * 4, y - 24);
    ctx.lineTo(x + len - d * 8, y - 28);
    ctx.lineTo(x + len - d * 8, y - 20);
    ctx.fill();
  }
}
new ResizeObserver(draw).observe(cv);
onTheme(() => { C = readColors(); draw(); });
onLang(syncUI);
syncUI();

</script>
